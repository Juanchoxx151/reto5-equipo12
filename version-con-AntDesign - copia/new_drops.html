<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Essential | New Drops</title>

<!-- Fuentes (mismas que la versión Tailwind) -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

<!-- React -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<!-- Dependencia de antd -->
<script src="https://unpkg.com/dayjs@1/dayjs.min.js"></script>
<!-- Ant Design (reset propio del framework, no es CSS nuestro) -->
<link rel="stylesheet" href="https://unpkg.com/antd@5/dist/reset.css">
<script src="https://unpkg.com/antd@5/dist/antd.min.js"></script>
<!-- Babel para poder escribir JSX directo en el navegador, sin build -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  /* Clases responsivas para cabecera y navegación */
  .mobile-menu-btn {
    display: none !important;
  }
  .topbar-spacer {
    display: block;
  }
  .logo-img {
    height: 96px;
    width: auto;
    object-fit: contain;
    transition: height 0.3s ease;
  }
  
  @media (max-width: 768px) {
    .mobile-menu-btn {
      display: flex !important;
      align-items: center;
      width: 84px !important;
    }
    .topbar-spacer {
      display: none !important;
    }
    .icon-label {
      display: none !important;
    }
    .icons-container {
      gap: 12px !important;
      min-width: 84px !important;
      justify-content: flex-end;
    }
    .navbar-container {
      display: none !important;
    }
    .logo-img {
      height: 56px !important;
    }
  }
</style>
</head>
<body style="margin:0;">
<div id="root"></div>

<script type="text/babel">
const { ConfigProvider, theme, Layout, Menu, Badge, Row, Col, Image,
        Typography, Divider, Button, Space, Checkbox, Drawer } = antd;
const { Header, Content, Footer } = Layout;
const { Title, Text } = Typography;

/* ---------- Iconos (SVG inline) ---------- */
const IconSearch = () => (
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
  </svg>
);
const IconUser = () => (
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
  </svg>
);
const IconCart = () => (
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
    <line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>
  </svg>
);

/* ---------- Paleta / tipografía ---------- */
const neonCyan   = '#00f0ff';
const darkBg     = '#050507';
const darkCard   = '#0a0a0e';
const darkBorder = '#1e1e2a';
const chromeLight = '#e4e4e7';
const chromeMid   = '#a1a1aa';
const chromeDark  = '#52525b';
const fontHeading = '"Orbitron", sans-serif';
const fontAccent  = '"Rajdhani", sans-serif';
const fontBody    = '"Inter", sans-serif';

/* ---------- Datos ---------- */
const productos = [
  { nombre: 'NEW ESSENTIAL REMERA OVERSIZE SEVEN WORDS', precio: 'ARS 24.999', imagen: 'img/remera_nueva.png', link: 'remera-drop.html' },
  { nombre: 'NEW ESSENTIAL CARGO SEVEN WORDS',            precio: 'ARS 39.999', imagen: 'img/pantalon_nuevo.png', link: 'pantalon-cargo.html' },
  { nombre: 'NEW ESSENTIAL BUZO SEVEN WORDS',             precio: 'ARS 34.999', imagen: 'img/buzo_nuevo.png', link: 'buzo-oversize.html' },
  { nombre: 'NEW ESSENTIAL GORRA SEVEN WORDS',            precio: 'ARS 14.999', imagen: 'img/gorra.png', link: 'gorra-trucker.html' },
];

// ---- Header unificado y responsivo ----
function Marca() {
  return (
    <a href="index.html">
      <img src="img/logo.png" alt="NEW ESSENTIAL — sentí la esencia" className="logo-img" />
    </a>
  );
}

const btnIconStyle = {
  background: 'none', border: 'none', color: chromeMid, cursor: 'pointer',
  display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2
};
const iconLabelStyle = { fontFamily: fontHeading, fontSize: 9, letterSpacing: '0.1em' };

function SiteHeader() {
  const [visible, setVisible] = React.useState(false);

  const linkStyle = { color: '#030712', fontWeight: 700, textDecoration: 'none' };
  const menuItems = [
    { key: 'home', label: <a href="index.html" style={linkStyle}>HOME</a> },
    {
      key: 'catalogo', label: <span style={linkStyle}>CATALOGO</span>,
      children: [
        { key: 'remeras', label: <a href="index.html">Remeras</a> },
        { key: 'pantalones', label: <a href="index.html">Pantalones</a> },
        { key: 'buzos', label: <a href="index.html">Buzos</a> },
        { key: 'gorras', label: <a href="index.html">Gorras</a> },
      ],
    },
    { key: 'new', label: <a href="new_drops.html" style={linkStyle}>NEW DROPS</a> },
    { key: 'nosotros', label: <a href="quienes_somos.html" style={linkStyle}>NOSOTROS</a> },
    { key: 'contacto', label: <a href="contacto.html" style={linkStyle}>CONTACTO</a> },
  ];

  const mobileMenuItems = [
    { key: 'home', label: <a href="index.html" style={{ color: chromeLight }}>HOME</a> },
    {
      key: 'catalogo', label: <span style={{ color: chromeLight }}>CATALOGO</span>,
      children: [
        { key: 'remeras', label: <a href="index.html" style={{ color: chromeLight }}>Remeras</a> },
        { key: 'pantalones', label: <a href="index.html" style={{ color: chromeLight }}>Pantalones</a> },
        { key: 'buzos', label: <a href="index.html" style={{ color: chromeLight }}>Buzos</a> },
        { key: 'gorras', label: <a href="index.html" style={{ color: chromeLight }}>Gorras</a> },
      ],
    },
    { key: 'new', label: <a href="new_drops.html" style={{ color: chromeLight }}>NEW DROPS</a> },
    { key: 'nosotros', label: <a href="quienes_somos.html" style={{ color: chromeLight }}>NOSOTROS</a> },
    { key: 'contacto', label: <a href="contacto.html" style={{ color: chromeLight }}>CONTACTO</a> },
  ];

  return (
    <Header style={{ position: 'sticky', top: 0, zIndex: 30, background: darkBg, borderBottom: `1px solid ${darkBorder}`, height: 'auto', lineHeight: 'normal', padding: 0 }}>
      <div className="topbar-container" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 16px', height: 'auto' }}>
        <div className="mobile-menu-btn">
          <button 
            onClick={() => setVisible(true)}
            style={{ background: 'none', border: 'none', color: chromeMid, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 0 }}
          >
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
              <line x1="4" y1="12" x2="20" y2="12" />
              <line x1="4" y1="6" x2="20" y2="6" />
              <line x1="4" y1="18" x2="20" y2="18" />
            </svg>
          </button>
        </div>
        <div className="topbar-spacer" style={{ width: 128 }} />
        
        <div style={{ flex: 1, textAlign: 'center' }}>
          <Marca />
        </div>
        
        <div className="icons-container" style={{ display: 'flex', alignItems: 'center', justifyContent: 'flex-end', gap: 20, minWidth: 128 }}>
          <button style={btnIconStyle} aria-label="Buscar">
            <IconSearch /><span className="icon-label" style={iconLabelStyle}>SEARCH</span>
          </button>
          <button style={btnIconStyle} aria-label="Perfil">
            <IconUser /><span className="icon-label" style={iconLabelStyle}>PROFILE</span>
          </button>
          <Badge count={0} showZero color={neonCyan} style={{ color: darkBg, fontWeight: 700 }}>
            <button style={btnIconStyle} aria-label="Carrito">
              <IconCart /><span className="icon-label" style={iconLabelStyle}>CART</span>
            </button>
          </Badge>
        </div>
      </div>

      <div className="navbar-container">
        <ConfigProvider theme={{ components: { Menu: {
            itemColor: '#030712', itemHoverColor: '#000000',
            horizontalItemSelectedColor: '#000000', itemBg: '#9ca3af',
            horizontalItemHoverBg: '#9ca3af', fontSize: 14, fontWeightStrong: 700,
            horizontalItemPaddingInline: 24,
        } } }}>
          <div style={{ background: '#9ca3af', padding: '10px 0' }}>
            <Menu
              mode="horizontal"
              items={menuItems}
              selectable={false}
              style={{ justifyContent: 'center', background: 'transparent', fontFamily: fontHeading, letterSpacing: '0.18em', borderBottom: 'none', lineHeight: 'normal' }}
            />
          </div>
        </ConfigProvider>
      </div>

      <Drawer
        title={<Text style={{ fontFamily: fontHeading, color: chromeLight, letterSpacing: 2 }}>MENU</Text>}
        placement="left"
        onClose={() => setVisible(false)}
        open={visible}
        styles={{
          body: { padding: 0, background: darkBg },
          header: { background: darkBg, borderBottom: `1px solid ${darkBorder}` }
        }}
        width={280}
      >
        <ConfigProvider theme={{ components: { Menu: {
          itemColor: chromeLight, itemHoverColor: neonCyan,
          itemSelectedColor: neonCyan, itemBg: darkBg,
          fontSize: 16,
        } } }}>
          <Menu
            mode="inline"
            items={mobileMenuItems}
            selectable={false}
            style={{ background: 'transparent', borderRight: 'none', fontFamily: fontHeading, letterSpacing: '0.1em' }}
          />
        </ConfigProvider>
      </Drawer>
    </Header>
  );
}

/* ---------- Bloque de filtro (Categoría / Drops / Color) ---------- */
function BloqueFiltro({ titulo, opciones }) {
  return (
    <div style={{ background: darkCard, border: `1px solid ${darkBorder}`, padding: '12px 16px' }}>
      <Text style={{ display: 'block', fontFamily: fontAccent, fontWeight: 700, fontSize: 14, letterSpacing: '0.05em', color: chromeLight, textTransform: 'uppercase', marginBottom: 12 }}>
        {titulo}
      </Text>
      <ConfigProvider theme={{ components: { Checkbox: {
          colorBorder: chromeMid,
          colorBgContainer: '#ffffff',
          borderRadiusSM: 2,
      } } }}>
        <Space direction="vertical" size={8}>
          {opciones.map((op) => (
            <Checkbox key={op}>
              <span style={{ color: chromeLight, fontFamily: fontBody, fontSize: 14 }}>{op}</span>
            </Checkbox>
          ))}
        </Space>
      </ConfigProvider>
    </div>
  );
}

/* ---------- Card de producto ---------- */
function ProductCard({ p }) {
  return (
    <a href={p.link} style={{ display: 'block', background: darkCard, border: `1px solid ${darkBorder}`, textDecoration: 'none' }}>
      <div style={{ aspectRatio: '1 / 1', position: 'relative', overflow: 'hidden' }}>
        <Image src={p.imagen} alt={p.nombre} preview={false} width="100%" height="100%" style={{ objectFit: 'cover' }} />
        <span style={{ position: 'absolute', top: 8, left: 8, background: neonCyan, color: darkBg, fontFamily: fontHeading, fontWeight: 700, fontSize: 9, padding: '2px 8px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>
          DROP 01
        </span>
      </div>
      <div style={{ padding: 12, borderTop: `1px solid ${darkBorder}` }}>
        <Text style={{ display: 'block', color: '#ffffff', fontFamily: fontHeading, fontWeight: 700, fontSize: 9, letterSpacing: '0.05em', textTransform: 'uppercase', lineHeight: 1.4, marginBottom: 8 }}>
          {p.nombre}
        </Text>
        <Text style={{ color: neonCyan, fontFamily: fontAccent, fontWeight: 700, fontSize: 14, letterSpacing: '0.02em' }}>
          {p.precio}
        </Text>
      </div>
    </a>
  );
}

function App() {
  return (
    <ConfigProvider theme={{
      algorithm: theme.darkAlgorithm,
      token: {
        colorPrimary: neonCyan,
        colorBgBase: darkBg,
        colorBgContainer: darkCard,
        colorBorder: darkBorder,
        colorText: chromeLight,
        colorTextSecondary: chromeMid,
        colorTextTertiary: chromeDark,
        fontFamily: fontBody,
      },
    }}>
      <Layout style={{ minHeight: '100vh', background: darkBg }}>
        <SiteHeader />

        <Content style={{ padding: '40px 24px 80px' }}>
          <div style={{ maxWidth: 1152, margin: '0 auto' }}>

            <Title level={1} style={{ textAlign: 'center', color: chromeLight, fontFamily: fontHeading, fontWeight: 700, fontSize: 48, marginBottom: 20 }}>
              NEW DROPS
            </Title>

            <div style={{ background: '#9ca3af', padding: '12px 16px', marginBottom: 32 }}>
              <Text style={{ fontFamily: fontAccent, fontWeight: 700, letterSpacing: '0.1em', color: '#111827', textTransform: 'uppercase' }}>
                FILTROS
              </Text>
            </div>

            <Row gutter={[16, 16]} style={{ marginBottom: 32 }}>
              <Col xs={24} md={8}>
                <BloqueFiltro titulo="Categoría" opciones={['Remeras', 'Pantalones', 'Buzos', 'Gorras']} />
              </Col>
              <Col xs={24} md={8}>
                <BloqueFiltro titulo="Drops" opciones={['Drop 01']} />
              </Col>
              <Col xs={24} md={8}>
                <BloqueFiltro titulo="Color" opciones={['Negro']} />
              </Col>
            </Row>

            <Row gutter={[24, 24]}>
              {productos.map((p) => (
                <Col key={p.nombre} xs={12} md={8} lg={6}>
                  <ProductCard p={p} />
                </Col>
              ))}
            </Row>

          </div>
        </Content>

        <Footer style={{ textAlign: 'center', borderTop: `1px solid ${darkBorder}`, background: 'rgba(5,5,7,0.9)' }}>
          <Space size={8} style={{ fontFamily: fontHeading }}>
            <Text style={{ color: chromeLight, fontStyle: 'italic', fontWeight: 700, letterSpacing: '0.15em' }}>new ESSENTIAL</Text>
            <Text style={{ color: chromeDark, fontSize: 12 }}>© 2026. ALL RIGHTS RESERVED.</Text>
          </Space>
        </Footer>
      </Layout>
    </ConfigProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
