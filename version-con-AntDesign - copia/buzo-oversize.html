<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="New Essential Buzo Seven Words — Buzo de algodón. ARS 34.999.">
  <title>Buzo Seven Words | New Essential (Ant Design)</title>

  <!-- Ant Design: reset de estilos base -->
  <link rel="stylesheet" href="https://unpkg.com/antd@5/dist/reset.css" />
  <!-- Tipografías (mismas que la versión Tailwind) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* Clases responsivas para cabecera y navegación */
    .mobile-menu-btn {
      display: none !important;
    }
    .topbar-spacer {
      display: block;
    }
    .logo-img {
      height: 96px;
      width: auto;
      object-fit: contain;
      transition: height 0.3s ease;
    }
    
    @media (max-width: 768px) {
      .mobile-menu-btn {
        display: flex !important;
        align-items: center;
        width: 84px !important;
      }
      .topbar-spacer {
        display: none !important;
      }
      .icon-label {
        display: none !important;
      }
      .icons-container {
        gap: 12px !important;
        min-width: 84px !important;
        justify-content: flex-end;
      }
      .navbar-container {
        display: none !important;
      }
      .logo-img {
        height: 56px !important;
      }
    }
  </style>
</head>
<body style="margin:0;">
  <div id="root"></div>

  <!-- React + ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- dayjs: dependencia interna de Ant Design -->
  <script src="https://unpkg.com/dayjs@1/dayjs.min.js"></script>
  <!-- Ant Design (UMD vía CDN, sin npm) -->
  <script src="https://unpkg.com/antd@5/dist/antd.min.js"></script>
  <!-- Babel standalone: nos deja escribir JSX directo en el navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const {
      ConfigProvider, theme, Layout, Menu, Badge, Button,
      Typography, Tag, Divider, Radio, Row, Col, Space, Drawer
    } = antd;
    const { Header, Content, Footer } = Layout;
    const { Title, Text, Paragraph } = Typography;

    // ---------- Íconos simples en SVG (sin librería de íconos) ----------
    const IconSearch = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <circle cx="11" cy="11" r="8" /><path d="m21 21-4.35-4.35" />
      </svg>
    );
    const IconUser = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" />
      </svg>
    );
    const IconCart = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
        <line x1="3" y1="6" x2="21" y2="6" /><path d="M16 10a4 4 0 0 1-8 0" />
      </svg>
    );
    const IconBack = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <line x1="19" y1="12" x2="5" y2="12" /><polyline points="12 19 5 12 12 5" />
      </svg>
    );
    const IconArrowRight = () => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <polyline points="9 18 15 12 9 6" />
      </svg>
    );

    // ---------- Tema oscuro / neón, vía tokens de Ant Design (nada de CSS propio) ----------
    const cyberTheme = {
      algorithm: theme.darkAlgorithm,
      token: {
        colorPrimary: "#00f0ff",
        colorBgBase: "#050507",
        colorBgContainer: "#0a0a0e",
        colorBgLayout: "#050507",
        colorBorder: "#1e1e2a",
        colorText: "#e4e4e7",
        colorTextSecondary: "#a1a1aa",
        fontFamily: "'Inter', sans-serif",
        borderRadius: 2,
      },
    };

    const fontHeading = { fontFamily: "'Orbitron', sans-serif" };
    const fontAccent = { fontFamily: "'Rajdhani', sans-serif" };

    // ---- Header unificado y responsivo ----
    function Marca() {
      return (
        <a href="index.html">
          <img src="./img/logo.png" alt="NEW ESSENTIAL — sentí la esencia" className="logo-img" />
        </a>
      );
    }

    const btnIconStyle = {
      background: "none", border: "none", color: "#a1a1aa", cursor: "pointer",
      display: "flex", flexDirection: "column", alignItems: "center", gap: 2,
    };
    const iconLabelStyle = { fontFamily: "'Orbitron', sans-serif", fontSize: 9, letterSpacing: "0.1em" };

    function SiteHeader() {
      const [visible, setVisible] = React.useState(false);

      const linkStyle = { color: "#030712", fontWeight: 700, textDecoration: "none" };
      const menuItems = [
        { key: "home", label: <a href="index.html" style={linkStyle}>HOME</a> },
        {
          key: "catalogo", label: <span style={linkStyle}>CATALOGO</span>,
          children: [
            { key: "remeras", label: <a href="index.html">Remeras</a> },
            { key: "pantalones", label: <a href="index.html">Pantalones</a> },
            { key: "buzos", label: <a href="index.html">Buzos</a> },
            { key: "gorras", label: <a href="index.html">Gorras</a> },
          ],
        },
        { key: "new", label: <a href="new_drops.html" style={linkStyle}>NEW DROPS</a> },
        { key: "nosotros", label: <a href="quienes_somos.html" style={linkStyle}>NOSOTROS</a> },
        { key: "contacto", label: <a href="contacto.html" style={linkStyle}>CONTACTO</a> },
      ];

      const mobileMenuItems = [
        { key: "home", label: <a href="index.html" style={{ color: "#e4e4e7" }}>HOME</a> },
        {
          key: "catalogo", label: <span style={{ color: "#e4e4e7" }}>CATALOGO</span>,
          children: [
            { key: "remeras", label: <a href="index.html" style={{ color: "#e4e4e7" }}>Remeras</a> },
            { key: "pantalones", label: <a href="index.html" style={{ color: "#e4e4e7" }}>Pantalones</a> },
            { key: "buzos", label: <a href="index.html" style={{ color: "#e4e4e7" }}>Buzos</a> },
            { key: "gorras", label: <a href="index.html" style={{ color: "#e4e4e7" }}>Gorras</a> },
          ],
        },
        { key: "new", label: <a href="new_drops.html" style={{ color: "#e4e4e7" }}>NEW DROPS</a> },
        { key: "nosotros", label: <a href="quienes_somos.html" style={{ color: "#e4e4e7" }}>NOSOTROS</a> },
        { key: "contacto", label: <a href="contacto.html" style={{ color: "#e4e4e7" }}>CONTACTO</a> },
      ];

      return (
        <Header style={{ position: "sticky", top: 0, zIndex: 30, background: "#050507", borderBottom: "1px solid #1e1e2a", height: "auto", lineHeight: "normal", padding: 0 }}>
          <div className="topbar-container" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 16px", height: "auto" }}>
            <div className="mobile-menu-btn">
              <button 
                onClick={() => setVisible(true)}
                style={{ background: "none", border: "none", color: "#a1a1aa", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", padding: 0 }}
              >
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <line x1="4" y1="12" x2="20" y2="12" />
                  <line x1="4" y1="6" x2="20" y2="6" />
                  <line x1="4" y1="18" x2="20" y2="18" />
                </svg>
              </button>
            </div>
            <div className="topbar-spacer" style={{ width: 128 }} />
            
            <div style={{ flex: 1, textAlign: "center" }}>
              <Marca />
            </div>
            
            <div className="icons-container" style={{ display: "flex", alignItems: "center", justifyContent: "flex-end", gap: 20, minWidth: 128 }}>
              <button style={btnIconStyle} aria-label="Buscar">
                <IconSearch /><span className="icon-label" style={iconLabelStyle}>SEARCH</span>
              </button>
              <button style={btnIconStyle} aria-label="Perfil">
                <IconUser /><span className="icon-label" style={iconLabelStyle}>PROFILE</span>
              </button>
              <Badge count={0} showZero color="#00f0ff" style={{ color: "#050507", fontWeight: 700 }}>
                <button style={btnIconStyle} aria-label="Carrito">
                  <IconCart /><span className="icon-label" style={iconLabelStyle}>CART</span>
                </button>
              </Badge>
            </div>
          </div>

          <div className="navbar-container">
            <ConfigProvider theme={{ components: { Menu: {
                itemColor: "#030712", itemHoverColor: "#000000",
                horizontalItemSelectedColor: "#000000", itemBg: "#9ca3af",
                horizontalItemHoverBg: "#9ca3af", fontSize: 14, fontWeightStrong: 700,
                horizontalItemPaddingInline: 24,
            } } }}>
              <div style={{ background: "#9ca3af", padding: "10px 0" }}>
                <Menu
                  mode="horizontal"
                  items={menuItems}
                  selectable={false}
                  style={{ justifyContent: "center", background: "transparent", fontFamily: "'Orbitron', sans-serif", letterSpacing: "0.18em", borderBottom: "none", lineHeight: "normal" }}
                />
              </div>
            </ConfigProvider>
          </div>

          <Drawer
            title={<Text style={{ fontFamily: "'Orbitron', sans-serif", color: "#e4e4e7", letterSpacing: 2 }}>MENU</Text>}
            placement="left"
            onClose={() => setVisible(false)}
            open={visible}
            styles={{
              body: { padding: 0, background: "#050507" },
              header: { background: "#050507", borderBottom: "1px solid #1e1e2a" }
            }}
            width={280}
          >
            <ConfigProvider theme={{ components: { Menu: {
              itemColor: "#e4e4e7", itemHoverColor: "#00f0ff",
              itemSelectedColor: "#00f0ff", itemBg: "#050507",
              fontSize: 16,
            } } }}>
              <Menu
                mode="inline"
                items={mobileMenuItems}
                selectable={false}
                style={{ background: "transparent", borderRight: "none", fontFamily: "'Orbitron', sans-serif", letterSpacing: "0.1em" }}
              />
            </ConfigProvider>
          </Drawer>
        </Header>
      );
    }

    function TallesSelector() {
      // Sin valor inicial: ningún talle debe quedar marcado por defecto
      const [talle, setTalle] = React.useState(null);
      const talles = ["S", "M", "L", "XL"];
      return (
        <Radio.Group
          value={talle}
          onChange={(e) => setTalle(e.target.value)}
          optionType="button"
          buttonStyle="outline"
          style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8, width: "100%" }}
        >
          {talles.map((t) => {
            const activo = talle === t;
            return (
              <Radio.Button
                key={t}
                value={t}
                style={{
                  textAlign: "center",
                  height: 44,
                  lineHeight: "42px",
                  background: "transparent",
                  borderColor: activo ? "#00f0ff" : "#3f3f46",
                  color: activo ? "#00f0ff" : "#e4e4e7",
                  boxShadow: "none",
                  fontSize: 12,
                  ...fontHeading,
                }}
                onMouseEnter={(e) => {
                  e.currentTarget.style.borderColor = "#00f0ff";
                  e.currentTarget.style.color = "#00f0ff";
                }}
                onMouseLeave={(e) => {
                  if (!activo) {
                    e.currentTarget.style.borderColor = "#3f3f46";
                    e.currentTarget.style.color = "#e4e4e7";
                  }
                }}
              >
                {t}
              </Radio.Button>
            );
          })}
        </Radio.Group>
      );
    }

    function App() {
      return (
        <ConfigProvider theme={cyberTheme}>
          <Layout style={{ minHeight: "100vh" }}>
            <SiteHeader />

            <Content style={{ padding: "24px 16px 80px" }}>
              <div style={{ maxWidth: 1120, margin: "0 auto" }}>

                <a href="index.html" style={{ color: "#e4e4e7", ...fontHeading }}>
                  <Space size={8} style={{ marginBottom: 32, fontSize: 12, letterSpacing: "0.2em" }}>
                    <IconBack /> [ VOLVER AL CATÁLOGO ]
                  </Space>
                </a>

                <Row gutter={[48, 40]}>
                  {/* Imagen principal */}
                  <Col xs={24} lg={12}>
                    <div
                      style={{
                        position: "relative",
                        aspectRatio: "1 / 1",
                        background: "#111118",
                        border: "1px solid #1e1e2a",
                        overflow: "hidden",
                      }}
                    >
                      <img
                        src="./img/buzo_nuevo.png"
                        alt="New Essential Buzo Seven Words"
                        style={{ width: "100%", height: "100%", objectFit: "cover" }}
                      />
                    </div>
                  </Col>

                  {/* Info y acciones */}
                  <Col xs={24} lg={12}>
                    <Tag
                      color="transparent"
                      style={{ ...fontHeading, color: "#00f0ff", fontSize: 11, letterSpacing: "0.25em", border: "none", padding: 0, marginBottom: 12 }}
                    >
                      [ BUZOS ]
                    </Tag>

                    <Title level={2} style={{ ...fontHeading, color: "#e4e4e7", marginTop: 0 }}>
                      NEW ESSENTIAL BUZO SEVEN WORDS
                    </Title>

                    <Text style={{ ...fontAccent, fontSize: 28, fontWeight: 700, color: "#00f0ff", display: "block", marginBottom: 24 }}>
                      ARS 34.999
                    </Text>

                    <Divider style={{ borderColor: "#1e1e2a" }} />

                    <div style={{ marginBottom: 24 }}>
                      <Text style={{ ...fontHeading, fontSize: 10, letterSpacing: "0.2em", textTransform: "uppercase" }}>
                        <span style={{ color: "#a1a1aa" }}>COLOR:// </span> Gris Oscuro
                      </Text>
                    </div>

                    <div style={{ marginBottom: 24 }}>
                      <Text style={{ ...fontHeading, fontSize: 10, letterSpacing: "0.2em", textTransform: "uppercase", display: "block", marginBottom: 12 }}>
                        <span style={{ color: "#a1a1aa" }}>TALLE://</span>
                      </Text>
                      <TallesSelector />
                    </div>

                    <Paragraph style={{ color: "#a1a1aa", fontSize: 14, lineHeight: 1.7, marginBottom: 24 }}>
                      Buzo de algodón 380 gr/m². Capucha estructurada con cordón plano. Bolsillo canguro
                      frontal reforzado. Cuffs y borde inferior en rib doble. Estampado editorial Seven
                      Words en serigrafía alta densidad.
                    </Paragraph>

                    <Button
                      href="contacto.html"
                      size="large"
                      block
                      style={{
                        ...fontHeading,
                        fontSize: 12,
                        letterSpacing: "0.15em",
                        borderColor: "#00f0ff",
                        borderWidth: 2,
                        color: "#e4e4e7",
                        background: "transparent",
                        height: 52,
                      }}
                      onMouseEnter={(e) => {
                        e.currentTarget.style.background = "#00f0ff";
                        e.currentTarget.style.color = "#050507";
                      }}
                      onMouseLeave={(e) => {
                        e.currentTarget.style.background = "transparent";
                        e.currentTarget.style.color = "#e4e4e7";
                      }}
                    >
                      <Space>
                        CONSULTAR DISPONIBILIDAD <IconArrowRight />
                      </Space>
                    </Button>
                  </Col>
                </Row>
              </div>
            </Content>

            <Footer
              style={{
                borderTop: "1px solid #1e1e2a",
                background: "rgba(5,5,7,0.9)",
                textAlign: "center",
              }}
            >
              <Space size={8}>
                <Text style={{ ...fontHeading, fontWeight: 700, fontStyle: "italic", letterSpacing: "0.1em" }}>
                  new ESSENTIAL
                </Text>
                <Text style={{ color: "#52525b", fontSize: 12 }}>© 2026. ALL RIGHTS RESERVED.</Text>
              </Space>
            </Footer>
          </Layout>
        </ConfigProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
