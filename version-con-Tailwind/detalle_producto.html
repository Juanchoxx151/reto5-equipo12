<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargando Producto... | New Essential</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Configuración Extendida de Tailwind -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            neon: { cyan: '#00f0ff', green: '#00ffcc' },
            dark: { bg: '#050507', card: '#0a0a0e', surface: '#111118', border: '#1e1e2a' },
            chrome: { light: '#e4e4e7', mid: '#a1a1aa', dark: '#52525b' }
          },
          fontFamily: {
            heading: ['Orbitron', 'sans-serif'],
            accent: ['Rajdhani', 'sans-serif'],
            body: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  
  <!-- Estilos Personalizados -->
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-dark-bg text-chrome-light min-h-screen w-full relative flex flex-col font-body">

  <!-- FONDO CIBERNÉTICO SVG -->
  <div class="cyber-bg">
    <svg viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid slice" fill="none" stroke="white" stroke-width="0.5">
      <g>
        <line x1="0" y1="900" x2="250" y2="0"/><line x1="50" y1="900" x2="280" y2="0"/>
        <line x1="100" y1="900" x2="310" y2="0"/><line x1="150" y1="900" x2="340" y2="0"/>
        <line x1="200" y1="900" x2="370" y2="0"/><line x1="0" y1="200" x2="380" y2="0"/>
        <line x1="0" y1="400" x2="350" y2="0"/><line x1="0" y1="600" x2="320" y2="0"/>
        <line x1="0" y1="800" x2="290" y2="0"/><line x1="0" y1="100" x2="400" y2="0"/>
        <line x1="0" y1="300" x2="370" y2="0"/><line x1="0" y1="500" x2="340" y2="0"/>
        <line x1="0" y1="700" x2="310" y2="0"/>
      </g>
      <g>
        <line x1="1400" y1="900" x2="1150" y2="0"/><line x1="1350" y1="900" x2="1120" y2="0"/>
        <line x1="1300" y1="900" x2="1090" y2="0"/><line x1="1250" y1="900" x2="1060" y2="0"/>
        <line x1="1200" y1="900" x2="1030" y2="0"/><line x1="1400" y1="200" x2="1020" y2="0"/>
        <line x1="1400" y1="400" x2="1050" y2="0"/><line x1="1400" y1="600" x2="1080" y2="0"/>
        <line x1="1400" y1="800" x2="1110" y2="0"/><line x1="1400" y1="100" x2="1000" y2="0"/>
        <line x1="1400" y1="300" x2="1030" y2="0"/><line x1="1400" y1="500" x2="1060" y2="0"/>
        <line x1="1400" y1="700" x2="1090" y2="0"/>
      </g>
    </svg>
  </div>

  <!-- HEADER (Igual que index.html) -->
  <header class="sticky top-0 z-30 w-full transition-all bg-dark-bg border-b border-dark-border">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between relative z-10">
      <div class="w-32 hidden md:block"></div>
      <div class="flex-1 flex justify-center">
        <a href="index.html" class="block">
          <img src="./img/logo.png" alt="NEW ESSENTIAL" class="h-20 md:h-24 w-auto object-contain logo-glow" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <div style="display: none;" class="flex-col items-center gap-0.5">
            <span class="font-heading font-black text-3xl tracking-widest chrome-text italic">new</span>
            <span class="font-heading font-bold text-sm tracking-[0.6em] chrome-text">ESSENTIAL</span>
          </div>
        </a>
      </div>
      <div class="flex items-center gap-5 w-32 justify-end">
        <button class="icon-btn flex flex-col items-center gap-0.5 text-chrome-mid">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
        <button class="icon-btn flex flex-col items-center gap-0.5 text-chrome-mid">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
        <button class="cart-icon-btn icon-btn flex flex-col items-center gap-0.5 text-chrome-mid relative">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span id="header-cart-badge" class="hidden absolute -top-1 -right-2 w-4 h-4 rounded-full bg-neon-cyan text-dark-bg text-[9px] font-bold flex items-center justify-center leading-none">0</span>
        </button>
      </div>
    </div>
    <nav class="chrome-bar relative z-10">
      <div class="max-w-6xl mx-auto px-4">
        <ul class="flex flex-wrap items-center justify-center py-2.5 gap-2 md:gap-0">
          <li><a href="index.html" class="nav-link font-heading text-xs md:text-sm px-3 md:px-6 tracking-[0.18em]">HOME</a></li>
          <li class="text-gray-600 font-light text-lg select-none hidden md:block">|</li>
          <li class="relative group">
            <a href="index.html" class="nav-link font-heading text-xs md:text-sm px-3 md:px-6 tracking-[0.18em] flex items-center gap-1">CATALOGO <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="opacity-70 group-hover:rotate-180 transition-transform"><polyline points="6 9 12 15 18 9"/></svg></a>
            <div class="absolute top-full left-1/2 -translate-x-1/2 pt-2 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 z-50">
              <div class="chrome-filter rounded-sm shadow-xl flex flex-col min-w-[180px] overflow-hidden">
                <a href="index.html" class="px-4 py-3 text-xs font-heading tracking-wider text-gray-900 font-bold border-b border-white/20 last:border-0 hover:bg-white/30 transition-colors">Remeras</a>
                <a href="index.html" class="px-4 py-3 text-xs font-heading tracking-wider text-gray-900 font-bold border-b border-white/20 last:border-0 hover:bg-white/30 transition-colors">Pantalones</a>
              </div>
            </div>
          </li>
          <li class="text-gray-600 font-light text-lg select-none hidden md:block">|</li>
          <li><a href="quienes_somos.html" class="nav-link font-heading text-xs md:text-sm px-3 md:px-6 tracking-[0.18em]">NOSOTROS</a></li>
          <li class="text-gray-600 font-light text-lg select-none hidden md:block">|</li>
          <li><a href="contacto.html" class="nav-link font-heading text-xs md:text-sm px-3 md:px-6 tracking-[0.18em]">CONTACTO</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <!-- CONTENIDO PDP -->
  <main class="flex-1 relative z-10 w-full pt-4 pb-20">
    <div id="pdp-container" class="max-w-7xl mx-auto px-4 md:px-6">
      
      <!-- Botón Volver Nativo (Window.history.back()) -->
      <button onclick="window.history.length > 1 ? window.history.back() : window.location.href='index.html'" class="flex items-center gap-2 text-chrome-light hover:text-neon-cyan transition-colors mb-6 font-heading text-xs tracking-[0.2em] uppercase">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        [ VOLVER AL CATALOGO ]
      </button>

      <div class="flex flex-col lg:flex-row gap-10 lg:gap-16">
        
        <!-- Izquierda: Galería HUD -->
        <div class="w-full lg:w-1/2 flex flex-col gap-4">
          <div class="relative aspect-[3/4] md:aspect-square lg:aspect-[4/5] bg-dark-surface border border-dark-border rounded-sm overflow-hidden scanlines group">
            <div class="absolute top-4 left-4 z-10 text-[10px] font-heading tracking-widest text-neon-cyan/70 select-none">SKU://#00293</div>
            <div class="absolute bottom-4 right-4 z-10 text-[10px] font-heading tracking-widest text-chrome-light/50 select-none">SYS://LOADED</div>
            <img id="main-image" src="" alt="Producto" class="w-full h-full object-cover relative z-0 transition-transform duration-700 hover:scale-105" />
          </div>
          <div id="thumbs-container" class="grid grid-cols-4 gap-3">
            <!-- Inyectado por gallery.js -->
          </div>
        </div>

        <!-- Derecha: Info y Acciones -->
        <div class="w-full lg:w-1/2 flex flex-col">
          
          <div class="mb-8">
            <span id="pdp-category" class="text-neon-cyan font-heading text-xs tracking-[0.25em] uppercase mb-3 inline-block"></span>
            <h1 id="pdp-name" class="font-heading font-bold text-3xl md:text-4xl text-chrome-light tracking-wide leading-tight mb-4"></h1>
            <div class="flex items-end gap-3">
              <p id="pdp-price" class="font-accent text-3xl md:text-4xl font-bold text-neon-cyan"></p>
              <p id="pdp-original-price" class="text-sm md:text-base text-chrome-mid line-through mb-1 font-body hidden"></p>
            </div>
          </div>

          <div class="w-full h-px bg-dark-border mb-8"></div>

          <!-- Selectores -->
          <div class="space-y-8 mb-10">
            <!-- Color -->
            <div>
              <p class="font-heading text-[10px] text-chrome-light tracking-[0.2em] mb-3 flex items-center gap-2">
                <span class="text-chrome-mid">COLOR://</span> <span id="pdp-color-name"></span>
              </p>
            </div>

            <!-- Talle -->
            <div>
              <p class="font-heading text-[10px] text-chrome-light tracking-[0.2em] mb-3 flex justify-between items-center">
                <span><span class="text-chrome-mid">TALLE://</span> <span id="pdp-size-display"></span></span>
              </p>
              
              <!-- Talle Único (Gorras/Accesorios) -->
              <div id="one-size-label" class="hidden">
                <span class="inline-block px-4 py-2 border border-neon-cyan/50 bg-neon-cyan/10 text-neon-cyan font-heading text-xs tracking-widest uppercase rounded-sm">TALLE ÚNICO // AJUSTABLE</span>
              </div>

              <!-- Selector Interactivo (Indumentaria) -->
              <div id="size-selector-container" class="grid grid-cols-4 gap-2 hidden">
                <button class="size-btn available py-3 font-heading text-xs tracking-wider border rounded-sm" data-size="S">S</button>
                <button class="size-btn selected border-neon-cyan text-neon-cyan bg-neon-cyan/10 py-3 font-heading text-xs tracking-wider border rounded-sm" data-size="M">M</button>
                <button class="size-btn available py-3 font-heading text-xs tracking-wider border rounded-sm" data-size="L">L</button>
                <button class="size-btn available py-3 font-heading text-xs tracking-wider border rounded-sm transition duration-300 hover:border-neon-cyan hover:text-neon-cyan hover:shadow-[0_0_12px_rgba(0,240,255,0.6)] hover:brightness-110">XL</button>
                <button class="size-btn disabled py-3 font-heading text-xs tracking-wider border rounded-sm relative" data-size="XXL">
                  <span class="line-through decoration-red-900/50">XXL</span>
                  <span class="absolute -top-2 left-1/2 -translate-x-1/2 bg-[#2a0808] text-red-500 text-[8px] font-bold px-1 whitespace-nowrap">AGOTADO</span>
                </button>
              </div>
            </div>

            <!-- Cantidad -->
            <div>
              <p class="font-heading text-[10px] text-chrome-light tracking-[0.2em] mb-3"><span class="text-chrome-mid">QTY://</span></p>
              <div class="flex items-center w-32 border border-dark-border bg-dark-surface rounded-sm">
                <button id="qty-minus" class="flex-1 py-2.5 flex justify-center text-chrome-light hover:text-neon-cyan hover:bg-dark-border transition-colors">-</button>
                <span id="qty-value" class="flex-1 text-center font-heading text-sm">1</span>
                <button id="qty-plus" class="flex-1 py-2.5 flex justify-center text-chrome-light hover:text-neon-cyan hover:bg-dark-border transition-colors">+</button>
              </div>
            </div>
          </div>

          <!-- Acciones -->
          <div class="flex flex-col gap-3 mb-10">
            <button id="add-to-cart-btn" class="w-full cta-btn group flex items-center justify-center gap-3">
              Añadir al carrito
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="group-hover:translate-x-1 transition-transform"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
          </div>

          <!-- Acordeones HTML Estático, Lógica en gallery.js -->
          <div class="border-t border-dark-border divide-y divide-dark-border">
            <div class="py-2">
              <button class="accordion-toggle w-full py-4 flex items-center justify-between text-left focus:outline-none" data-target="desc-body">
                <span class="font-heading text-xs tracking-[0.15em] text-chrome-light uppercase">Descripción</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="chevron-icon text-neon-cyan transform rotate-180 transition-transform"><polyline points="6 9 12 15 18 9"></polyline></svg>
              </button>
              <div id="desc-body" class="accordion-body open py-4 font-body text-sm text-chrome-mid leading-relaxed">
                <p id="pdp-description"></p>
              </div>
            </div>
            <!-- Otros acordeones (envío, cuidados) pueden ir aquí si se requiere -->
          </div>

        </div>
      </div>
    </div>
  </main>

  <footer class="mt-auto border-t border-dark-border bg-dark-bg/90 backdrop-blur-md relative z-10">
    <div class="max-w-6xl mx-auto px-4 py-8">
      <div class="flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-2">
          <span class="font-heading font-bold text-sm chrome-text italic tracking-widest">new ESSENTIAL</span>
          <span class="text-chrome-dark text-xs">© 2026. ALL RIGHTS RESERVED.</span>
        </div>
      </div>
    </div>
  </footer>

  <!-- Scripts Obligatorios -->
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
