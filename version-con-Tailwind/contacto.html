<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="New Essential — Contacto. Escribinos para consultas de disponibilidad y pedidos.">
  <title>Contacto | New Essential</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            neon: { cyan: '#00f0ff', green: '#00ffcc' },
            dark: { bg: '#050507', card: '#0a0a0e', surface: '#111118', border: '#1e1e2a' },
            chrome: { light: '#e4e4e7', mid: '#a1a1aa', dark: '#52525b' }
          },
          fontFamily: {
            heading: ['Orbitron', 'sans-serif'],
            accent:  ['Rajdhani', 'sans-serif'],
            body:    ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-dark-bg text-chrome-light min-h-screen w-full relative flex flex-col font-body">

  <!-- FONDO CIBERNÉTICO SVG -->
  <div class="cyber-bg">
    <svg viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid slice" fill="none" stroke="white" stroke-width="0.5">
      <g>
        <line x1="0" y1="900" x2="250" y2="0"/><line x1="50" y1="900" x2="280" y2="0"/>
        <line x1="100" y1="900" x2="310" y2="0"/>
      </g>
      <g>
        <line x1="1400" y1="900" x2="1150" y2="0"/><line x1="1350" y1="900" x2="1120" y2="0"/>
      </g>
    </svg>
  </div>

  <!-- CABECERA -->
  <header class="sticky top-0 z-30 w-full bg-dark-bg border-b border-dark-border">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="w-24 hidden md:block"></div>
      <div class="flex-1 flex justify-center">
        <a href="index.html">
          <img src="./img/logo.png" alt="New Essential" class="h-20 w-auto object-contain logo-glow"
               onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <div style="display:none;" class="flex-col items-center">
            <span class="font-heading font-black text-2xl tracking-widest chrome-text italic">new</span>
            <span class="font-heading font-bold text-xs tracking-[0.6em] chrome-text">ESSENTIAL</span>
          </div>
        </a>
      </div>
      <div class="w-24 hidden md:block"></div>
    </div>

    <!-- BARRA DE NAVEGACIÓN METÁLICA -->
    <nav class="chrome-bar">
      <div class="max-w-6xl mx-auto px-4">
        <ul class="flex flex-wrap items-center justify-center py-2.5 gap-2 md:gap-0">
          <li><a href="index.html" class="nav-link font-heading text-xs md:text-sm px-3 md:px-6 tracking-[0.18em]">HOME</a></li>
          <li class="text-gray-600 hidden md:block text-lg">|</li>
          <li class="relative group">
            <a href="index.html" class="nav-link font-heading text-xs md:text-sm px-3 md:px-6 tracking-[0.18em] flex items-center gap-1">
              CATALOGO
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="opacity-70 group-hover:rotate-180 transition-transform"><polyline points="6 9 12 15 18 9"/></svg>
            </a>
            <div class="absolute top-full left-1/2 -translate-x-1/2 pt-2 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 z-50">
              <div class="chrome-filter rounded-sm shadow-xl flex flex-col min-w-[180px] overflow-hidden">
                <a href="remera-cyber.html"  class="px-4 py-3 text-xs font-heading tracking-wider text-gray-900 font-bold border-b border-white/20 hover:bg-white/30 transition-colors">Remeras</a>
                <a href="pantalon-cargo.html" class="px-4 py-3 text-xs font-heading tracking-wider text-gray-900 font-bold border-b border-white/20 hover:bg-white/30 transition-colors">Pantalones</a>
                <a href="index.html"         class="px-4 py-3 text-xs font-heading tracking-wider text-gray-900 font-bold border-b border-white/20 hover:bg-white/30 transition-colors">Mystery Box</a>
                <a href="buzo-cargo.html"    class="px-4 py-3 text-xs font-heading tracking-wider text-gray-900 font-bold border-b border-white/20 hover:bg-white/30 transition-colors">Buzos</a>
                <a href="gorra-trucker.html" class="px-4 py-3 text-xs font-heading tracking-wider text-gray-900 font-bold hover:bg-white/30 transition-colors">Gorras</a>
              </div>
            </div>
          </li>
          <li class="text-gray-600 hidden md:block text-lg">|</li>
          <li><a href="quienes_somos.html" class="nav-link font-heading text-xs md:text-sm px-3 md:px-6 tracking-[0.18em]">NOSOTROS</a></li>
          <li class="text-gray-600 hidden md:block text-lg">|</li>
          <li><a href="contacto.html" class="nav-link font-heading text-xs md:text-sm px-3 md:px-6 tracking-[0.18em]">CONTACTO</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <!-- CONTENIDO: FORMULARIO DE CONTACTO -->
  <main class="flex-1 relative z-10 w-full pt-12 pb-20">
    <div class="max-w-2xl mx-auto px-4">

      <!-- TÍTULO DE SECCIÓN -->
      <h1 class="hero-heading text-center mb-12">CONECTATE</h1>

      <!-- FORMULARIO ESTÁTICO HTML -->
      <!-- El formulario está diseñado para integrarse con un servicio externo como Formspree o Netlify Forms -->
      <div class="bg-dark-card border border-dark-border p-8 scanlines">
        <form action="#" method="POST" class="space-y-6">

          <!-- CAMPO: NOMBRE -->
          <div>
            <label for="nombre" class="block font-heading text-[10px] text-chrome-light tracking-[0.2em] mb-2 uppercase">
              Nombre Completo
            </label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              placeholder="INGRESÁ TU NOMBRE..."
              class="w-full bg-dark-bg border border-dark-border focus:border-[#00f0ff] text-chrome-light p-3 outline-none transition-colors font-body text-sm"
            >
          </div>

          <!-- CAMPO: EMAIL -->
          <div>
            <label for="email" class="block font-heading text-[10px] text-chrome-light tracking-[0.2em] mb-2 uppercase">
              E-mail de Contacto
            </label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="SYS@SERVER.COM"
              class="w-full bg-dark-bg border border-dark-border focus:border-[#00f0ff] text-chrome-light p-3 outline-none transition-colors font-body text-sm"
            >
          </div>

          <!-- CAMPO: MENSAJE -->
          <div>
            <label for="mensaje" class="block font-heading text-[10px] text-chrome-light tracking-[0.2em] mb-2 uppercase">
              Mensaje
            </label>
            <textarea
              id="mensaje"
              name="mensaje"
              rows="5"
              placeholder="INGRESAR TRANSMISIÓN AQUÍ..."
              class="w-full bg-dark-bg border border-dark-border focus:border-[#00f0ff] text-chrome-light p-3 outline-none transition-colors font-body text-sm resize-none"
            ></textarea>
          </div>

          <!-- BOTÓN DE ENVÍO -->
          <button type="submit" class="cta-btn w-full flex items-center justify-center gap-3">
            ENVIAR TRANSMISIÓN
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </button>

        </form>
      </div>

    </div>
  </main>

  <!-- PIE DE PÁGINA -->
  <footer class="mt-auto border-t border-dark-border bg-dark-bg/90 relative z-10">
    <div class="max-w-6xl mx-auto px-4 py-8 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-2">
        <span class="font-heading font-bold text-sm chrome-text italic tracking-widest">new ESSENTIAL</span>
        <span class="text-chrome-dark text-xs">© 2026. ALL RIGHTS RESERVED.</span>
      </div>
      <div class="flex gap-4">
        <a href="#" class="social-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg></a>
        <a href="#" class="social-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg></a>
      </div>
    </div>
  </footer>

</body>
</html>
