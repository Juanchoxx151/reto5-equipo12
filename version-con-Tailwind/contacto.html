<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="New Essential — Contacto. Escribinos para consultas de disponibilidad y pedidos.">
  <title>Contacto | New Essential</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            neon: { cyan: '#00f0ff', green: '#00ffcc' },
            dark: { bg: '#050507', card: '#0a0a0e', surface: '#111118', border: '#1e1e2a' },
            chrome: { light: '#e4e4e7', mid: '#a1a1aa', dark: '#52525b' }
          },
          fontFamily: {
            heading: ['Orbitron', 'sans-serif'],
            accent:  ['Rajdhani', 'sans-serif'],
            body:    ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-dark-bg text-chrome-light min-h-screen w-full relative flex flex-col font-body">

    <!-- ==========================================
       HEADER Y NAVEGACIÓN
       ========================================== -->
  <header class="sticky top-0 z-30 w-full transition-all bg-dark-bg border-b border-dark-border py-0">
    <div class="w-full px-4 flex items-center relative z-10">
      
      <!-- Espaciador Izquierdo -->
      <div class="w-32 hidden md:block"></div>

      <!-- Logo Central -->
      <div class="flex-1 flex justify-center">
        <a href="index.html" class="block">
          <img src="./img/logo.png" alt="NEW ESSENTIAL — sentí la esencia" class="h-24 md:h-24 w-auto object-contain logo-glow" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          
        </a>
      </div>

      <!-- Íconos de Acción (Derecha) — ml-auto los fija al extremo derecho en mobile y desktop -->
      <div class="flex items-center gap-5 ml-auto">
        <button class="icon-btn flex flex-col items-center gap-0.5 text-chrome-mid " aria-label="Buscar">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <span class="text-[9px] font-heading tracking-widest hidden md:block">SEARCH</span>
        </button>
        <button class="icon-btn flex flex-col items-center gap-0.5 text-chrome-mid" aria-label="Perfil">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="text-[9px] font-heading tracking-widest hidden md:block">PROFILE</span>
        </button>
        
        <button class="cart-icon-btn icon-btn flex flex-col items-center gap-0.5 text-chrome-mid relative" aria-label="Carrito">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="text-[9px] font-heading tracking-widest hidden md:block">CART</span>
          <span id="header-cart-badge" class=" absolute -top-1 -right-2 w-4 h-4 rounded-full bg-neon-cyan text-dark-bg text-[9px] font-bold flex items-center justify-center leading-none">0</span>
        </button>
      </div>
    </div>

    <!-- Barra de Navegación Metálica -->
    <nav class="bg-gray-400 relative z-10">
      <div class="max-w-6xl mx-auto px-4">
        <ul class="flex flex-wrap items-center justify-center py-2.5 gap-2 md:gap-0">
          <li><a href="index.html" class="nav-link font-heading text-xs md:text-sm px-3 md:px-6 tracking-[0.18em]">HOME</a></li>
          <li class="text-gray-600 font-light text-lg select-none hidden md:block">|</li>
          
          <!-- Menú Desplegable CATALOGO — hover en desktop, click nativo en mobile (SIN JS) -->
          <li class="relative group">
            <!-- Checkbox oculto que controla el estado de abierto/cerrado al hacer click -->
            <input type="checkbox" id="catalogo-toggle" class="peer hidden">
            <label for="catalogo-toggle" class="nav-link font-heading text-xs md:text-sm px-3 md:px-6 tracking-[0.18em] flex items-center gap-1 cursor-pointer select-none">
              CATALOGO
            </label>
            <!-- Dropdown: visible al hacer hover (group-hover) O al tocar/cliquear (peer-checked) -->
            <div class="absolute top-full left-1/2 -translate-x-1/2 pt-2 opacity-0 invisible transition-all duration-300 z-50 group-hover:opacity-100 group-hover:visible peer-checked:opacity-100 peer-checked:visible">
              <div class="rounded-sm shadow-xl flex flex-col min-w-[180px] overflow-hidden">
                <a href="index.html" class="bg-white px-4 py-3 text-xs font-heading tracking-wider text-gray-900 font-bold border-b hover:bg-gray-200 transition-colors">Remeras</a>
                <a href="index.html" class="bg-white px-4 py-3 text-xs font-heading tracking-wider text-gray-900 font-bold border-b hover:bg-gray-200 transition-colors">Pantalones</a>
                <a href="index.html" class="bg-white px-4 py-3 text-xs font-heading tracking-wider text-gray-900 font-bold border-b  hover:bg-gray-200 transition-colors">Buzos</a>
                <a href="index.html" class="bg-white px-4 py-3 text-xs font-heading tracking-wider text-gray-900 font-bold border-b  hover:bg-gray-200 transition-colors">Gorras</a>
              </div>
            </div>
          </li>
          
          <li class="text-gray-600 font-light text-lg select-none hidden md:block">|</li>
          <li><a href="new_drops.html" class="nav-link font-heading text-xs md:text-sm px-3 md:px-6 tracking-[0.18em]">NEW DROPS</a></li>
          <li class="text-gray-600 font-light text-lg select-none hidden md:block">|</li>
          <li><a href="quienes_somos.html" class="nav-link font-heading text-xs md:text-sm px-3 md:px-6 tracking-[0.18em]">NOSOTROS</a></li>
          <li class="text-gray-600 font-light text-lg select-none hidden md:block">|</li>
          <li><a href="contacto.html" class="nav-link font-heading text-xs md:text-sm px-3 md:px-6 tracking-[0.18em]">CONTACTO</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <!-- CONTENIDO: FORMULARIO DE CONTACTO -->
  <main class="flex-1 relative z-10 w-full pt-12 pb-20">
    <div class="max-w-2xl mx-auto px-4">

      <!-- TÍTULO DE SECCIÓN -->
      <h1 class="hero-heading text-center mb-12">CONTACTANOS</h1>

      <!-- FORMULARIO ESTÁTICO HTML -->
      <!-- El formulario está diseñado para integrarse con un servicio externo como Formspree o Netlify Forms -->
      <div class="bg-dark-card border border-dark-border p-8 scanlines">
        <form action="#" method="POST" class="space-y-6">

          <!-- CAMPO: NOMBRE -->
          <div>
            <label for="nombre" class="block font-heading text-[10px] text-chrome-light tracking-[0.2em] mb-2 uppercase">
              Nombre Completo
            </label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              placeholder="INGRESÁ TU NOMBRE..."
              class="w-full bg-dark-bg border border-dark-border focus:border-[#00f0ff] text-chrome-light p-3 outline-none transition-colors font-body text-sm"
            >
          </div>

          <!-- CAMPO: EMAIL -->
          <div>
            <label for="email" class="block font-heading text-[10px] text-chrome-light tracking-[0.2em] mb-2 uppercase">
              E-mail de Contacto
            </label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="SYS@SERVER.COM"
              class="w-full bg-dark-bg border border-dark-border focus:border-[#00f0ff] text-chrome-light p-3 outline-none transition-colors font-body text-sm"
            >
          </div>

          <!-- CAMPO: MENSAJE -->
          <div>
            <label for="mensaje" class="block font-heading text-[10px] text-chrome-light tracking-[0.2em] mb-2 uppercase">
              Mensaje
            </label>
            <textarea
              id="mensaje"
              name="mensaje"
              rows="5"
              placeholder="INGRESAR TRANSMISIÓN AQUÍ..."
              class="w-full bg-dark-bg border border-dark-border focus:border-[#00f0ff] text-chrome-light p-3 outline-none transition-colors font-body text-sm resize-none"
            ></textarea>
          </div>

          <!-- BOTÓN DE ENVÍO -->
          <button type="submit" class="cta-btn w-full flex items-center justify-center gap-3">
            ENVIAR TRANSMISIÓN
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </button>

        </form>
      </div>

    </div>
  </main>

  <!-- PIE DE PÁGINA -->
  <footer class="mt-auto border-t border-dark-border bg-dark-bg/90 relative z-10">
    <div class="max-w-6xl mx-auto px-4 py-8 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-2">
        <span class="font-heading font-bold text-sm chrome-text italic tracking-widest">new ESSENTIAL</span>
        <span class="text-chrome-dark text-xs">© 2026. ALL RIGHTS RESERVED.</span>
      </div>
      <div class="flex gap-4">
        <a href="#" class="social-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg></a>
        <a href="#" class="social-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg></a>
      </div>
    </div>
  </footer>

</body>
</html>
