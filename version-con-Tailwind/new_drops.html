      </div>

      <!-- Íconos de Acción (Derecha) -->
      <div class="flex items-center gap-5 w-32 justify-end">
        <button class="icon-btn flex flex-col items-center gap-0.5 text-chrome-mid" aria-label="Buscar">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <span class="text-[9px] font-heading tracking-widest hidden md:block">SEARCH</span>
        </button>
        <button class="icon-btn flex flex-col items-center gap-0.5 text-chrome-mid" aria-label="Perfil">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>

          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>

          <span id="header-cart-badge" class="hidden absolute -top-1 -right-2 w-4 h-4 rounded-full bg-neon-cyan text-dark-bg text-[9px] font-bold flex items-center justify-center leading-none">0</span>

    </div>
    <nav class="chrome-bar relative z-10">

        <ul class="flex flex-wrap items-center justify-center py-2.5 gap-2 md:gap-0">
          <li><a href="index.html" class="nav-link font-heading text-xs md:text-sm px-3 md:px-6 tracking-[0.18em]">HOME</a></li>
          <li class="text-gray-600 font-light text-lg select-none hidden md:block">|</li>

            <!-- Dropdown -->
            <div class="absolute top-full left-1/2 -translate-x-1/2 pt-2 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 z-50">
              <div class="chrome-filter rounded-sm shadow-xl flex flex-col min-w-[180px] overflow-hidden">
                <a href="#" class="px-4 py-3 text-xs font-heading tracking-wider text-gray-900 font-bold border-b border-white/20 last:border-0 hover:bg-white/30 transition-colors">Remeras</a>
                <a href="#" class="px-4 py-3 text-xs font-heading tracking-wider text-gray-900 font-bold border-b border-white/20 last:border-0 hover:bg-white/30 transition-colors">Pantalones</a>
                <a href="#" class="px-4 py-3 text-xs font-heading tracking-wider text-gray-900 font-bold border-b border-white/20 last:border-0 hover:bg-white/30 transition-colors">Mystery Box</a>
                <a href="#" class="px-4 py-3 text-xs font-heading tracking-wider text-gray-900 font-bold border-b border-white/20 last:border-0 hover:bg-white/30 transition-colors">Buzos</a>
                <a href="#" class="px-4 py-3 text-xs font-heading tracking-wider text-gray-900 font-bold border-b border-white/20 last:border-0 hover:bg-white/30 transition-colors">Gorras</a>

            </div>

          <li class="text-gray-600 font-light text-lg select-none hidden md:block">|</li>

          <li class="text-gray-600 font-light text-lg select-none hidden md:block">|</li>
          <li><a href="contacto.html" class="nav-link font-heading text-xs md:text-sm px-3 md:px-6 tracking-[0.18em]">CONTACTO</a></li>
        </ul>

  <!-- CONTENIDO -->
  <main class="flex-1 relative z-10 w-full pt-12 pb-20">
    <section id="catalogo" class="max-w-6xl mx-auto px-4 py-6 mt-4">
      <h1 class="hero-heading text-center mb-10">NEW DROPS</h1>
      <div class="flex flex-col lg:flex-row gap-4 items-start relative">
        <!-- Grilla de Productos Dinámica -->
        <div class="flex-1">
          <!-- Este div será llenado dinámicamente por main.js (1 col mobile, 2 tablet, 4 PC) -->
          <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
            <!-- Render JS -->
          </div>
        </div>

      </div>
    </section>

  <footer class="mt-auto border-t border-dark-border bg-dark-bg/90 backdrop-blur-md relative z-10">
    <div class="max-w-6xl mx-auto px-4 py-8 text-center">
      <span class="font-heading font-bold text-sm chrome-text italic tracking-widest">new ESSENTIAL</span>
