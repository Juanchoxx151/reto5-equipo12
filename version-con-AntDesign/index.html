<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Essential | Catálogo (Ant Design)</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@500;600;700&family=Michroma&display=swap" rel="stylesheet">
  
  <!-- CSS de Ant Design por CDN (Tema Oscuro) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/antd/4.24.16/antd.dark.min.css">
  
  <!-- ESTILOS PERSONALIZADOS -->
  <style>
    :root {
      --bg-dark: #050507;
      --bg-card: #0a0a0e;
      --border-dark: #1e1e2a;
      --neon-cyan: #00f0ff;
      --chrome-light: #e4e4e7;
      --chrome-mid: #a1a1aa;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--chrome-light);
      font-family: 'Inter', sans-serif;
      margin: 0;
    }

    .font-heading { font-family: 'Michroma', 'Orbitron', sans-serif; }
    .font-accent { font-family: 'Rajdhani', sans-serif; }

    /* Fondo Cibernético SVG */
    .cyber-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0.15;
      pointer-events: none;
    }

    /* EFECTO CROMADO/METÁLICO PARA BARRAS */
    .chrome-bg {
      background: linear-gradient(180deg, #111111 0%, #a1a1aa 35%, #ffffff 50%, #a1a1aa 65%, #111111 100%);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
    }

    .nav-link-custom {
      color: #050507;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 2px;
      font-weight: 900;
      padding: 10px 25px;
      transition: all 0.3s;
    }

    .nav-link-custom:hover {
      color: #000000;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
    }

    .nav-separator {
      color: #333;
      user-select: none;
      font-weight: 300;
      font-size: 18px;
    }
    
    /* Botón CTA Neón */
    .cta-btn {
      display: inline-block;
      background-color: transparent;
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
      padding: 12px 24px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .cta-btn:hover {
      background-color: var(--neon-cyan);
      color: var(--bg-dark);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }

    /* Tarjetas y Checkboxes */
    .ant-card {
      background: var(--bg-card);
      border-color: var(--border-dark);
      border-radius: 0;
      transition: transform 0.3s ease;
    }
    .ant-card-cover img {
      border-radius: 0 !important;
      transition: transform 0.5s ease;
    }
    .ant-card:hover .ant-card-cover img {
      transform: scale(1.05);
    }
    
    .ant-checkbox-checked .ant-checkbox-inner {
      background-color: #fff;
      border-color: #fff;
    }
    .ant-checkbox-inner::after {
      border-color: #000 !important;
    }
    .ant-checkbox-wrapper {
      color: #e4e4e7;
      font-size: 13px;
    }
  </style>

  <!-- Librerías de React y Ant Design por CDN -->
  <script src="https://unpkg.com/react@17/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/antd/4.24.16/antd.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

  <!-- Contenedor del Fondo SVG -->
  <div class="cyber-bg">
    <svg viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid slice" fill="none" stroke="white" strokeWidth="0.5">
      <g>
        <line x1="0" y1="900" x2="250" y2="0"/><line x1="50" y1="900" x2="280" y2="0"/>
        <line x1="100" y1="900" x2="310" y2="0"/><line x1="150" y1="900" x2="340" y2="0"/>
        <line x1="200" y1="900" x2="370" y2="0"/><line x1="0" y1="200" x2="380" y2="0"/>
      </g>
      <g>
        <line x1="1400" y1="900" x2="1150" y2="0"/><line x1="1350" y1="900" x2="1120" y2="0"/>
        <line x1="1300" y1="900" x2="1090" y2="0"/><line x1="1250" y1="900" x2="1060" y2="0"/>
        <line x1="1200" y1="900" x2="1030" y2="0"/><line x1="1400" y1="200" x2="1020" y2="0"/>
      </g>
    </svg>
  </div>

  <div id="root"></div>

  <script type="text/babel">
    const { Layout, Row, Col, Card, Checkbox, Badge } = antd;
    const { Content, Footer } = Layout;

    function CatalogoApp() {
      const productos = [
        { id: 1, title: 'NEW ESSENTIAL REMERA OVERSIZE SEVEN WORDS', price: 'ARS 24.999', img: './img/remera_nueva.png', drop: 'DROP 01' },
        { id: 2, title: 'NEW ESSENTIAL CARGO SEVEN WORDS', price: 'ARS 39.999', img: './img/pantalon_nuevo.png', drop: 'DROP 01' },
        { id: 3, title: 'NEW ESSENTIAL BUZO SEVEN WORDS', price: 'ARS 34.999', img: './img/buzo_nuevo.png', drop: 'DROP 01' },
        { id: 4, title: 'NEW ESSENTIAL GORRA SEVEN WORDS', price: 'ARS 14.999', img: './img/gorra.png', drop: 'DROP 01' }
      ];

      const filtrosData = [
        { titulo: 'CATEGORÍA', opciones: ['Remeras', 'Pantalones', 'Buzos', 'Gorras'] },
        { titulo: 'DROPS', opciones: ['Drop 01', 'Cyber-Core'] },
        { titulo: 'COLOR', opciones: ['Black', 'Silver'] }
      ];

      return (
        <Layout style={{ background: 'transparent', minHeight: '100vh' }}>
          
          {/* HEADER Y NAVEGACIÓN */}
          <header style={{ position: 'sticky', top: 0, zIndex: 50, width: '100%' }}>
            
            {/* Parte Superior */}
            <div style={{ background: '#050507', padding: '15px 40px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div style={{ width: '150px' }}></div>
              
              {/* Logo Oficial con Brillo Neón Fuerte */}
              <div style={{ flex: 1, display: 'flex', justifyContent: 'center' }}>
                <a href="index.html">
                  <img 
                    src="./img/logo.png" 
                    alt="NEW ESSENTIAL" 
                    style={{ 
                      height: '70px', 
                      width: 'auto', 
                      objectFit: 'contain', 
                      filter: 'drop-shadow(0 0 15px rgba(0,240,255,0.8))' 
                    }} 
                  />
                </a>
              </div>

              {/* Íconos de Acción */}
              <div style={{ display: 'flex', gap: '25px', color: '#a1a1aa', width: '150px', justifyContent: 'flex-end' }}>
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', cursor: 'pointer' }}>
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                  <span className="font-heading" style={{ fontSize: '9px', marginTop: '4px', letterSpacing: '1px' }}>SEARCH</span>
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', cursor: 'pointer' }}>
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                  <span className="font-heading" style={{ fontSize: '9px', marginTop: '4px', letterSpacing: '1px' }}>PROFILE</span>
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', cursor: 'pointer', position: 'relative' }}>
                  <Badge count={0} size="small" style={{ backgroundColor: '#00f0ff', color: '#050507', position: 'absolute', top: '-5px', right: '-10px' }} />
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                  <span className="font-heading" style={{ fontSize: '9px', marginTop: '4px', letterSpacing: '1px' }}>CART</span>
                </div>
              </div>
            </div>

            {/* Menú Cromado */}
            <nav className="chrome-bg" style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', padding: '8px 0', borderTop: '1px solid #333', borderBottom: '1px solid #000' }}>
              <a href="index.html" className="font-heading nav-link-custom">HOME</a>
              <span className="nav-separator">|</span>
              <a href="#catalogo" className="font-heading nav-link-custom">CATALOGO ⌵</a>
              <span className="nav-separator">|</span>
              <a href="new_drops.html" className="font-heading nav-link-custom">NEW DROPS</a>
              <span className="nav-separator">|</span>
              <a href="quienes_somos.html" className="font-heading nav-link-custom">NOSOTROS</a>
              <span className="nav-separator">|</span>
              <a href="contacto.html" className="font-heading nav-link-custom">CONTACTO</a>
            </nav>
            
          </header>

          <Content style={{ position: 'relative', zIndex: 10, padding: '40px 20px', maxWidth: '1200px', margin: '0 auto', width: '100%' }}>
            
            {/* SECCIÓN HERO */}
            <Row style={{ background: '#000', border: '1px solid #1e1e2a', marginBottom: '40px' }}>
              <Col xs={24} md={12} style={{ padding: '50px', display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
                <h1 className="font-heading" style={{ color: '#e4e4e7', fontSize: '2.5rem', fontWeight: 'bold', marginBottom: '30px' }}>
                  SENTÍ LA ESENCIA<br/>DEL FUTURO
                </h1>
                <div>
                  <button className="cta-btn">VER COLECCIÓN</button>
                </div>
              </Col>
              <Col xs={24} md={12} style={{ height: '350px', background: '#111' }}>
                <video src="./img/hero-bg.mp4" autoPlay loop muted playsInline style={{ width: '100%', height: '100%', objectFit: 'cover' }}></video>
              </Col>
            </Row>

            {/* TITULO DE FILTROS CROMADO */}
            <div className="chrome-bg" style={{ padding: '12px 20px', marginBottom: '0px', border: '1px solid #000' }}>
              <span className="font-heading" style={{ color: '#050507', fontWeight: '900', letterSpacing: '2px', fontSize: '14px' }}>FILTROS</span>
            </div>
            
            {/* CAJAS DE FILTROS IGUAL A LA IMAGEN */}
            <Row style={{ marginBottom: '40px', background: '#050507', border: '1px solid #1e1e2a', borderTop: 'none' }}>
              {filtrosData.map((filtro, idx) => (
                <Col xs={24} md={8} key={idx} style={{ padding: '20px', borderRight: idx !== 2 ? '1px solid #1e1e2a' : 'none' }}>
                  <p className="font-heading" style={{ color: '#e4e4e7', fontWeight: 'bold', fontSize: '11px', letterSpacing: '1px', marginBottom: '15px' }}>{filtro.titulo}</p>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                    {filtro.opciones.map((opc, i) => (
                      <Checkbox key={i}>{opc}</Checkbox>
                    ))}
                  </div>
                </Col>
              ))}
            </Row>

            {/* GRILLA DE PRODUCTOS */}
            <Row gutter={[24, 24]}>
              {productos.map(prod => (
                <Col xs={12} md={8} lg={6} key={prod.id}>
                  <Card
                    hoverable
                    cover={
                      <div style={{ position: 'relative', overflow: 'hidden', aspectRatio: '1/1' }}>
                        
                        {/* Etiqueta DROP */}
                        <div style={{ position: 'absolute', top: '10px', left: '10px', background: '#00f0ff', color: '#050507', padding: '4px 8px', fontSize: '10px', fontWeight: 'bold', zIndex: 2 }} className="font-heading">
                          {prod.drop}
                        </div>

                        {/* Icono de Corazón */}
                        <div style={{ position: 'absolute', top: '10px', right: '10px', zIndex: 2, background: 'rgba(0,0,0,0.5)', padding: '5px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" strokeWidth="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                        </div>

                        <img alt={prod.title} src={prod.img} style={{ width: '100%', height: '100%', objectFit: 'cover' }} 
                             onError={(e) => {e.target.src = 'https://via.placeholder.com/400x400/1e1e2a/ffffff?text=FOTO+PROD'}} />
                      </div>
                    }
                    bodyStyle={{ padding: '15px', borderTop: '1px solid #1e1e2a', background: '#0a0a0e' }}
                  >
                    <h3 className="font-heading" style={{ color: '#fff', fontSize: '10px', textTransform: 'uppercase', marginBottom: '10px', height: '28px', lineHeight: '1.4' }}>
                      {prod.title}
                    </h3>
                    <p className="font-heading" style={{ color: '#00f0ff', fontWeight: 'bold', margin: 0, fontSize: '13px' }}>
                      {prod.price}
                    </p>
                  </Card>
                </Col>
              ))}
            </Row>

          </Content>

          {/* FOOTER ALINEADO SEGÚN IMAGEN */}
          <Footer style={{ background: '#050507', padding: '30px 40px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', zIndex: 10 }}>
            <div>
              <span className="font-heading" style={{ color: '#a1a1aa', fontStyle: 'italic', fontWeight: 'bold', fontSize: '14px', marginRight: '10px' }}>new ESSENTIAL</span>
              <span style={{ color: '#52525b', fontSize: '12px' }}>© 2026. ALL RIGHTS RESERVED.</span>
            </div>
            <div style={{ display: 'flex', gap: '15px', color: '#a1a1aa' }}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style={{cursor: 'pointer'}}><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style={{cursor: 'pointer'}}><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
            </div>
          </Footer>

        </Layout>
      );
    }

    ReactDOM.render(<CatalogoApp />, document.getElementById('root'));
  </script>
</body>
</html>
