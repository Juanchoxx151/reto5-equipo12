<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="New Essential — Contacto. Escribinos para consultas de disponibilidad y pedidos.">
<title>Contacto | New Essential</title>

<!-- Fuentes (mismas que la versión Tailwind) -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

<!-- React -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<!-- Dependencia de antd -->
<script src="https://unpkg.com/dayjs@1/dayjs.min.js"></script>
<!-- Ant Design (reset propio del framework, no es CSS nuestro) -->
<link rel="stylesheet" href="https://unpkg.com/antd@5/dist/reset.css">
<script src="https://unpkg.com/antd@5/dist/antd.min.js"></script>
<!-- Babel para poder escribir JSX directo en el navegador, sin build -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;">
<div id="root"></div>

<script type="text/babel">
const { ConfigProvider, theme, Layout, Menu, Badge, Row, Col,
        Typography, Space, Form, Input, Button } = antd;
const { Header, Content, Footer } = Layout;
const { Title, Text, Paragraph } = Typography;

/* ---------- Iconos (SVG inline, iguales a quienes_somos.html) ---------- */
const IconSearch = () => (
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
  </svg>
);
const IconUser = () => (
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
  </svg>
);
const IconCart = () => (
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
    <line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>
  </svg>
);
const IconArrow = () => (
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <polyline points="9 18 15 12 9 6"/>
  </svg>
);

/* ---------- Paleta / tipografía (idéntica a quienes_somos.html) -------- */
const neonCyan   = '#00f0ff';
const darkBg     = '#050507';
const darkCard   = '#0a0a0e';
const darkBorder = '#1e1e2a';
const chromeLight = '#e4e4e7';
const chromeMid   = '#a1a1aa';
const chromeDark  = '#52525b';
const fontHeading = '"Orbitron", sans-serif';
const fontBody    = '"Inter", sans-serif';

function Marca() {
  return (
    <a href="index.html">
      <img src="img/logo.png" alt="NEW ESSENTIAL — sentí la esencia" style={{ height: 96, width: 'auto', objectFit: 'contain' }} />
    </a>
  );
}

/* ---------- TopBar: copiado tal cual de quienes_somos.html ------------- */
function TopBar() {
  return (
    <div style={{ display: 'flex', alignItems: 'center', padding: '0 16px' }}>
      <div style={{ width: 114 }} />
      <div style={{ flex: 1, textAlign: 'center' }}>
        <Marca />
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 20 }}>
        <button style={btnIconStyle} aria-label="Buscar">
          <IconSearch /><span style={iconLabelStyle}>SEARCH</span>
        </button>
        <button style={btnIconStyle} aria-label="Perfil">
          <IconUser /><span style={iconLabelStyle}>PROFILE</span>
        </button>
        <Badge count={0} showZero color={neonCyan} style={{ color: darkBg, fontWeight: 700 }}>
          <button style={btnIconStyle} aria-label="Carrito">
            <IconCart /><span style={iconLabelStyle}>CART</span>
          </button>
        </Badge>
      </div>
    </div>
  );
}
const btnIconStyle = {
  background: 'none', border: 'none', color: chromeMid, cursor: 'pointer',
  display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2, width: 40,
};
const iconLabelStyle = { fontFamily: fontHeading, fontSize: 9, letterSpacing: '0.1em' };

/* ---------- NavBar: copiado tal cual de quienes_somos.html, con separadores y tokens corregidos ---------- */
function NavBar() {
  const sepStyle = {
    color: '#4b5563',
    fontWeight: 300,
    fontSize: 18,
    cursor: 'default',
    userSelect: 'none',
    opacity: 1,
  };

  const linkStyle = {
    color: '#030712',
    fontWeight: 600,
    textDecoration: 'none',
  };

  const subLinkStyle = { color: '#030712' };

  const menuItems = [
    { key: 'home', label: <a href="index.html" style={linkStyle}>HOME</a> },
    { key: 'sep1', label: <span style={sepStyle}>|</span>, disabled: true },
    {
      key: 'catalogo', label: <span style={linkStyle}>CATALOGO</span>,
      children: [
        { key: 'remeras', label: <a href="new_drops.html" style={subLinkStyle}>Remeras</a> },
        { key: 'pantalones', label: <a href="new_drops.html" style={subLinkStyle}>Pantalones</a> },
        { key: 'buzos', label: <a href="new_drops.html" style={subLinkStyle}>Buzos</a> },
        { key: 'gorras', label: <a href="new_drops.html" style={subLinkStyle}>Gorras</a> },
      ],
    },
    { key: 'sep2', label: <span style={sepStyle}>|</span>, disabled: true },
    { key: 'new', label: <a href="new_drops.html" style={linkStyle}>NEW DROPS</a> },
    { key: 'sep3', label: <span style={sepStyle}>|</span>, disabled: true },
    { key: 'nosotros', label: <a href="quienes_somos.html" style={linkStyle}>NOSOTROS</a> },
    { key: 'sep4', label: <span style={sepStyle}>|</span>, disabled: true },
    { key: 'contacto', label: <a href="contacto.html" style={linkStyle}>CONTACTO</a> },
  ];
  return (
    <ConfigProvider theme={{ components: { Menu: {
        itemColor: '#030712', itemHoverColor: '#000000',
        horizontalItemSelectedColor: '#000000', itemBg: '#9ca3af',
        horizontalItemHoverBg: '#9ca3af', fontSize: 14.9, fontWeightStrong: 700,
        itemPaddingInline: 11,
        popupBg: '#ffffff',
    } } }}>
      <div style={{ background: '#9ca3af', padding: '13px 0' }}>
        <Menu
          mode="horizontal"
          items={menuItems}
          selectable={false}
          style={{ justifyContent: 'center', background: 'transparent', fontFamily: fontHeading, letterSpacing: '0.15em', borderBottom: 'none', lineHeight: 'normal' }}
        />
      </div>
    </ConfigProvider>
  );
}

/* ---------- Formulario de contacto (lógica del contacto.html original) --------- */
function fieldLabel(text) {
  return (
    <span style={{ fontFamily: fontHeading, fontSize: 10, letterSpacing: '0.2em', textTransform: 'uppercase' }}>
      {text}
    </span>
  );
}

function ContactoForm() {
  const [form] = Form.useForm();

  function onFinish(values) {
    console.log('Transmisión enviada:', values);
  }

  return (
    <Content style={{ padding: '48px 24px 80px' }}>
      <div style={{ maxWidth: 640, margin: '0 auto' }}>
        <Title level={1} style={{ fontFamily: fontHeading, fontWeight: 700, fontSize: 48, textAlign: 'center', color: chromeLight, marginBottom: 20 }}>
          CONTACTANOS
        </Title>

        <div style={{ background: darkCard, border: `1px solid ${darkBorder}`, padding: 32 }}>
          <Form form={form} layout="vertical" onFinish={onFinish} requiredMark={false}>
            <Form.Item name="nombre" label={fieldLabel('Nombre Completo')}>
              <Input placeholder="INGRESÁ TU NOMBRE..." size="large" />
            </Form.Item>
            <Form.Item name="email" label={fieldLabel('E-mail de Contacto')}>
              <Input type="email" placeholder="SYS@SERVER.COM" size="large" />
            </Form.Item>
            <Form.Item name="mensaje" label={fieldLabel('Mensaje')}>
              <Input.TextArea rows={5} placeholder="INGRESAR TRANSMISIÓN AQUÍ..." />
            </Form.Item>
            <Form.Item style={{ marginBottom: 0 }}>
              <Button
                type="text" htmlType="submit" block size="large"
                icon={<IconArrow />} iconPosition="end"
                style={{
                  background: 'transparent', border: 'none', boxShadow: 'none',
                  color: chromeLight, fontFamily: fontHeading, fontWeight: 700,
                  letterSpacing: '0.15em', height: 48,
                }}
              >
                ENVIAR TRANSMISIÓN
              </Button>
            </Form.Item>
          </Form>
        </div>
      </div>
    </Content>
  );
}

function App() {
  return (
    <ConfigProvider theme={{
      algorithm: theme.darkAlgorithm,
      token: {
        colorPrimary: neonCyan,
        colorBgBase: darkBg,
        colorBgContainer: darkCard,
        colorBorder: darkBorder,
        colorText: chromeLight,
        colorTextSecondary: chromeMid,
        colorTextTertiary: chromeDark,
        colorTextPlaceholder: chromeDark,
        fontFamily: fontBody,
      },
    }}>
      <Layout style={{ minHeight: '100vh', background: darkBg }}>
        <Header style={{ position: 'sticky', top: 0, zIndex: 30, background: darkBg, borderBottom: `1px solid ${darkBorder}`, height: 'auto', lineHeight: 'normal', padding: 0 }}>
          <TopBar />
          <NavBar />
        </Header>

        <ContactoForm />

        <Footer style={{ textAlign: 'center', borderTop: `1px solid ${darkBorder}`, background: 'rgba(5,5,7,0.9)' }}>
          <Space size={8} style={{ fontFamily: fontHeading }}>
            <Text style={{ color: chromeLight, fontStyle: 'italic', fontWeight: 700, letterSpacing: '0.15em' }}>new ESSENTIAL</Text>
            <Text style={{ color: chromeDark, fontSize: 12 }}>© 2026. ALL RIGHTS RESERVED.</Text>
          </Space>
        </Footer>
      </Layout>
    </ConfigProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
