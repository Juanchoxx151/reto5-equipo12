<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="New Essential — Contacto. Escribinos para consultas de disponibilidad y pedidos.">
  <title>Contacto | New Essential</title>

  <!-- Tipografía (igual que la versión Tailwind) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- React + ReactDOM (CDN, versiones fijas y estables) -->
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>

  <!-- dayjs: requerido por AntDesign -->
  <script src="https://unpkg.com/dayjs@1.11.10/dayjs.min.js"></script>

  <!-- AntDesign (CDN, UMD, versión fija). No carga ningún .css — AntDesign v5 inyecta
       sus propios estilos vía JS (CSS-in-JS), por eso esta versión no necesita
       hoja de estilos propia. -->
  <script src="https://unpkg.com/antd@5.17.0/dist/antd.min.js"></script>

  <!-- No hay <link> a estilos.css: la maquetación completa se resuelve con componentes
       y el sistema de grillas (Row/Col) de AntDesign, no con CSS propio.
       Tampoco se usa Babel: el JSX se reemplaza por React.createElement directo,
       así el navegador ejecuta el JS tal cual, sin traducirlo en vivo. -->
</head>
<body>

  <div id="root"></div>

  <script>
    const e = React.createElement;
    const { ConfigProvider, theme, Layout, Row, Col, Menu, Badge, Space,
            Typography, Form, Input, Button, Grid } = antd;
    const { Header, Content, Footer } = Layout;
    const { Title, Text } = Typography;

    // ---- Íconos como SVG (los mismos trazos que la versión Tailwind) ----
    function IconSearch() {
      return e('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 },
        e('circle', { cx: 11, cy: 11, r: 8 }),
        e('path', { d: 'm21 21-4.35-4.35' })
      );
    }
    function IconUser() {
      return e('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 },
        e('path', { d: 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2' }),
        e('circle', { cx: 12, cy: 7, r: 4 })
      );
    }
    function IconCart() {
      return e('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 },
        e('path', { d: 'M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z' }),
        e('line', { x1: 3, y1: 6, x2: 21, y2: 6 }),
        e('path', { d: 'M16 10a4 4 0 0 1-8 0' })
      );
    }
    function IconArrow() {
      return e('svg', { width: 18, height: 18, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 },
        e('polyline', { points: '9 18 15 12 9 6' })
      );
    }

    // Paleta equivalente a la definida en tailwind.config del sitio
    const PALETTE = {
      neonCyan: '#00f0ff',
      bg: '#050507',
      card: '#0a0a0e',
      border: '#1e1e2a',
      chromeLight: '#e4e4e7',
      chromeMid: '#a1a1aa',
      chromeDark: '#52525b',
    };

    const catalogoItems = [
      { key: 'remeras', label: e('a', { href: 'index.html' }, 'Remeras') },
      { key: 'pantalones', label: e('a', { href: 'index.html' }, 'Pantalones') },
      { key: 'buzos', label: e('a', { href: 'index.html' }, 'Buzos') },
      { key: 'gorras', label: e('a', { href: 'index.html' }, 'Gorras') },
    ];

    const menuItems = [
      { key: 'home', label: e('a', { href: 'index.html' }, 'HOME') },
      { key: 'catalogo', label: 'CATALOGO', children: catalogoItems },
      { key: 'new_drops', label: e('a', { href: 'new_drops.html' }, 'NEW DROPS') },
      { key: 'nosotros', label: e('a', { href: 'quienes_somos.html' }, 'NOSOTROS') },
      { key: 'contacto', label: e('a', { href: 'contacto.html' }, 'CONTACTO') },
    ];

    function SiteHeader() {
      const screens = Grid.useBreakpoint();

      function actionButton(iconEl, labelText) {
        return e(Space, { direction: 'vertical', size: 2, align: 'center' },
          e(Button, { type: 'text', shape: 'circle', icon: iconEl, style: { color: PALETTE.chromeMid } }),
          screens.md ? e(Text, {
            style: { fontFamily: "'Orbitron', sans-serif", fontSize: 9, letterSpacing: 2, color: PALETTE.chromeMid }
          }, labelText) : null
        );
      }

      return e(Header, {
        style: {
          position: 'sticky', top: 0, zIndex: 30, width: '100%', height: 'auto',
          padding: 0, background: PALETTE.bg, borderBottom: `1px solid ${PALETTE.border}`, lineHeight: 'normal'
        }
      },
        e(Row, { align: 'middle', style: { padding: '10px 16px' } },
          e(Col, { xs: 0, md: 6 }),
          e(Col, { xs: 16, md: 12, style: { textAlign: 'center' } },
            e('a', { href: 'index.html' },
              e('img', {
                src: './img/logo.png',
                alt: 'NEW ESSENTIAL — sentí la esencia',
                style: { height: 88, width: 'auto', objectFit: 'contain' }
              })
            )
          ),
          e(Col, { xs: 8, md: 6 },
            e(Row, { justify: 'end', gutter: 16 },
              e(Col, null, actionButton(e(IconSearch), 'SEARCH')),
              e(Col, null, actionButton(e(IconUser), 'PROFILE')),
              e(Col, null,
                e(Badge, { count: 0, showZero: true, color: PALETTE.neonCyan, offset: [-4, 4] },
                  actionButton(e(IconCart), 'CART')
                )
              )
            )
          )
        ),
        e('div', { style: { background: PALETTE.chromeMid, padding: '10px 0' } },
          e(Menu, {
            mode: 'horizontal',
            selectedKeys: ['contacto'],
            items: menuItems,
            style: {
              justifyContent: 'center',
              background: 'transparent',
              borderBottom: 'none',
              fontFamily: "'Orbitron', sans-serif",
              fontWeight: 700,
              fontSize: 15,
              letterSpacing: '0.18em',
            }
          })
        )
      );
    }

    function ContactoForm() {
      const [form] = Form.useForm();

      function onFinish(values) {
        console.log('Transmisión enviada:', values);
      }

      function fieldLabel(text) {
        return e('span', {
          style: { fontFamily: "'Orbitron', sans-serif", fontSize: 10, letterSpacing: '0.2em', textTransform: 'uppercase' }
        }, text);
      }

      return e(Content, { style: { flex: 1, padding: '48px 16px 80px' } },
        e(Row, { justify: 'center' },
          e(Col, { xs: 24, sm: 22, md: 16, lg: 12, xl: 10 },
            e(Title, {
              level: 1,
              style: { textAlign: 'center', fontFamily: "'Orbitron', sans-serif", color: PALETTE.chromeLight, marginBottom: 20 }
            }, 'CONTACTANOS'),

            e('div', { style: { background: PALETTE.card, border: `1px solid ${PALETTE.border}`, padding: 32 } },
              e(Form, { form: form, layout: 'vertical', onFinish: onFinish, requiredMark: false },
                e(Form.Item, { name: 'nombre', label: fieldLabel('Nombre Completo') },
                  e(Input, { placeholder: 'INGRESÁ TU NOMBRE...', size: 'large' })
                ),
                e(Form.Item, { name: 'email', label: fieldLabel('E-mail de Contacto') },
                  e(Input, { type: 'email', placeholder: 'SYS@SERVER.COM', size: 'large' })
                ),
                e(Form.Item, { name: 'mensaje', label: fieldLabel('Mensaje') },
                  e(Input.TextArea, { rows: 5, placeholder: 'INGRESAR TRANSMISIÓN AQUÍ...' })
                ),
                e(Form.Item, { style: { marginBottom: 0 } },
                  e(Button, {
                    type: 'text', htmlType: 'submit', block: true, size: 'large',
                    icon: e(IconArrow), iconPosition: 'end',
                    style: {
                      background: 'transparent',
                      border: 'none',
                      boxShadow: 'none',
                      color: PALETTE.chromeLight,
                      fontFamily: "'Orbitron', sans-serif",
                      fontWeight: 700,
                      letterSpacing: '0.15em',
                      height: 48,
                    }
                  }, 'ENVIAR TRANSMISIÓN')
                )
              )
            )
          )
        )
      );
    }

    function SiteFooter() {
      return e(Footer, {
        style: { textAlign: 'center', background: 'rgba(5,5,7,0.9)', borderTop: `1px solid ${PALETTE.border}` }
      },
        e(Space, { size: 8 },
          e(Text, {
            style: { fontFamily: "'Orbitron', sans-serif", fontWeight: 700, fontStyle: 'italic', letterSpacing: 2, color: PALETTE.chromeLight }
          }, 'new ESSENTIAL'),
          e(Text, { style: { color: PALETTE.chromeDark, fontSize: 12 } }, '© 2026. ALL RIGHTS RESERVED.')
        )
      );
    }

    function App() {
      return e(ConfigProvider, {
        theme: {
          algorithm: theme.darkAlgorithm,
          token: {
            colorPrimary: PALETTE.neonCyan,
            colorBgBase: PALETTE.bg,
            colorBgContainer: PALETTE.card,
            colorBgLayout: PALETTE.bg,
            colorBorder: PALETTE.border,
            colorText: PALETTE.chromeLight,
            colorTextSecondary: PALETTE.chromeMid,
            colorTextPlaceholder: PALETTE.chromeDark,
            fontFamily: "'Inter', sans-serif",
            borderRadius: 0,
          },
          components: {
            Menu: { itemColor: '#0a0a0a', itemHoverColor: '#000000', horizontalItemSelectedColor: '#000000' },
            Layout: { headerBg: PALETTE.bg, footerBg: 'transparent', bodyBg: PALETTE.bg },
          },
        }
      },
        e(Layout, { style: { minHeight: '100vh', background: PALETTE.bg } },
          e(SiteHeader),
          e(ContactoForm),
          e(SiteFooter)
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(App));
  </script>

</body>
</html>
