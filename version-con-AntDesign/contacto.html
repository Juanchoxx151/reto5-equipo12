<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="New Essential — Contacto. Escribinos para consultas de disponibilidad y pedidos.">
  <title>Contacto | New Essential (Ant Design)</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@500;600;700&family=Michroma&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/antd/4.24.16/antd.dark.min.css">

  <style>
    :root {
      --bg-dark: #050507;
      --bg-card: #0a0a0e;
      --border-dark: #1e1e2a;
      --neon-cyan: #00f0ff;
      --chrome-light: #e4e4e7;
      --chrome-mid: #a1a1aa;
      --chrome-dark: #52525b;
    }

    body { background-color: var(--bg-dark); color: var(--chrome-light); font-family: 'Inter', sans-serif; margin: 0; }
    .font-heading { font-family: 'Michroma', 'Orbitron', sans-serif; }
    .font-accent { font-family: 'Rajdhani', sans-serif; }

    /* Fondo cibernético SVG */
    .cyber-bg { position: fixed; inset: 0; z-index: 0; opacity: 0.15; pointer-events: none; }

    /* Barra metálica de navegación */
    .chrome-bg {
      background: linear-gradient(180deg, #111111 0%, #a1a1aa 35%, #ffffff 50%, #a1a1aa 65%, #111111 100%);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
    }
    .nav-link-custom { color: #050507; text-decoration: none; font-size: 13px; letter-spacing: 2px; font-weight: 900; padding: 10px 25px; transition: all 0.3s; display: inline-flex; align-items: center; gap: 4px; }
    .nav-link-custom:hover { color: #000000; text-shadow: 0 0 8px rgba(0, 240, 255, 0.8); }
    .nav-separator { color: #333; user-select: none; font-weight: 300; font-size: 18px; }

    /* Botón CTA neón */
    .cta-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; background-color: transparent; color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan); padding: 14px 24px; font-family: 'Orbitron', sans-serif;
      font-weight: 700; font-size: 14px; letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer; transition: all 0.3s ease;
    }
    .cta-btn:hover { background-color: var(--neon-cyan); color: var(--bg-dark); box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }

    /* Íconos de acción del header */
    .icon-btn { background: transparent; border: none; cursor: pointer; }

    /* Inputs con estética terminal */
    .ant-input, textarea.ant-input {
      background: var(--bg-dark) !important;
      border: 1px solid var(--border-dark) !important;
      color: var(--chrome-light) !important;
      border-radius: 0 !important;
      font-size: 13px !important;
      padding: 12px !important;
    }
    .ant-input:focus, .ant-input-focused, textarea.ant-input:focus {
      border-color: var(--neon-cyan) !important;
      box-shadow: none !important;
    }
    .ant-input::placeholder { color: var(--chrome-dark) !important; }
    .contact-label {
      font-family: 'Michroma', 'Orbitron', sans-serif;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--chrome-light);
      text-transform: uppercase;
      margin-bottom: 8px;
      display: block;
    }

    /* Dropdown de catálogo */
    .ant-dropdown-menu {
      background: linear-gradient(180deg, #111111 0%, #a1a1aa 35%, #ffffff 50%, #a1a1aa 65%, #111111 100%) !important;
      border-radius: 0 !important;
      padding: 0 !important;
      min-width: 180px;
    }
    .ant-dropdown-menu-item {
      font-family: 'Michroma', 'Orbitron', sans-serif !important;
      font-size: 11px !important;
      letter-spacing: 1px !important;
      color: #050507 !important;
      font-weight: bold !important;
      padding: 12px 16px !important;
      border-bottom: 1px solid rgba(255,255,255,0.2) !important;
    }
    .ant-dropdown-menu-item:hover { background: rgba(255,255,255,0.3) !important; }
  </style>

  <script src="https://unpkg.com/react@17/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/antd/4.24.16/antd.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

  <!-- Fondo cibernético SVG -->
  <div class="cyber-bg">
    <svg viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid slice" fill="none" stroke="white" strokeWidth="0.5">
      <g>
        <line x1="0" y1="900" x2="250" y2="0"/><line x1="50" y1="900" x2="280" y2="0"/>
        <line x1="100" y1="900" x2="310" y2="0"/>
      </g>
      <g>
        <line x1="1400" y1="900" x2="1150" y2="0"/><line x1="1350" y1="900" x2="1120" y2="0"/>
      </g>
    </svg>
  </div>

  <div id="root"></div>

  <script type="text/babel">
    const { Layout, Row, Col, Form, Input, Badge, Menu, Dropdown } = antd;
    const { Content, Footer } = Layout;
    const { TextArea } = Input;

    function ContactoApp() {

      const onFinish = (values) => {
        console.log('Transmisión enviada:', values);
      };

      const catalogoMenu = (
        <Menu>
          <Menu.Item key="remeras"><a href="index.html">Remeras</a></Menu.Item>
          <Menu.Item key="pantalones"><a href="index.html">Pantalones</a></Menu.Item>
          <Menu.Item key="mystery"><a href="index.html">Mystery Box</a></Menu.Item>
          <Menu.Item key="buzos"><a href="index.html">Buzos</a></Menu.Item>
          <Menu.Item key="gorras"><a href="index.html">Gorras</a></Menu.Item>
        </Menu>
      );

      return (
        <Layout style={{ background: 'transparent', minHeight: '100vh' }}>

          {/* HEADER Y NAVEGACIÓN */}
          <header style={{ position: 'sticky', top: 0, zIndex: 50, width: '100%' }}>

            <div style={{ background: '#050507', padding: '15px 40px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid #1e1e2a' }}>
              <div style={{ width: '150px' }}></div>

              <div style={{ flex: 1, display: 'flex', justifyContent: 'center' }}>
                <a href="index.html">
                  <img
                    src="./img/logo.png"
                    alt="NEW ESSENTIAL — sentí la esencia"
                    style={{ height: '70px', width: 'auto', objectFit: 'contain', filter: 'drop-shadow(0 0 15px rgba(0,240,255,0.8))' }}
                  />
                </a>
              </div>

              <div style={{ display: 'flex', gap: '25px', color: '#a1a1aa', width: '150px', justifyContent: 'flex-end' }}>
                <button className="icon-btn" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', color: '#a1a1aa' }}>
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                  <span className="font-heading" style={{ fontSize: '9px', marginTop: '4px', letterSpacing: '1px' }}>SEARCH</span>
                </button>
                <button className="icon-btn" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', color: '#a1a1aa' }}>
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                  <span className="font-heading" style={{ fontSize: '9px', marginTop: '4px', letterSpacing: '1px' }}>PROFILE</span>
                </button>
                <button className="icon-btn" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', color: '#a1a1aa', position: 'relative' }}>
                  <Badge count={0} size="small" style={{ backgroundColor: '#00f0ff', color: '#050507', position: 'absolute', top: '-5px', right: '-10px' }} />
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                  <span className="font-heading" style={{ fontSize: '9px', marginTop: '4px', letterSpacing: '1px' }}>CART</span>
                </button>
              </div>
            </div>

            {/* Menú cromado */}
            <nav className="chrome-bg" style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', padding: '8px 0', borderTop: '1px solid #333', borderBottom: '1px solid #000' }}>
              <a href="index.html" className="font-heading nav-link-custom">HOME</a>
              <span className="nav-separator">|</span>

              <Dropdown overlay={catalogoMenu} trigger={['hover']}>
                <a href="index.html" className="font-heading nav-link-custom">
                  CATALOGO
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="6 9 12 15 18 9"/></svg>
                </a>
              </Dropdown>

              <span className="nav-separator">|</span>
              <a href="new_drops.html" className="font-heading nav-link-custom">NEW DROPS</a>
              <span className="nav-separator">|</span>
              <a href="quienes_somos.html" className="font-heading nav-link-custom">NOSOTROS</a>
              <span className="nav-separator">|</span>
              <a href="contacto.html" className="font-heading nav-link-custom">CONTACTO</a>
            </nav>

          </header>

          {/* CONTENIDO: FORMULARIO DE CONTACTO */}
          <Content style={{ position: 'relative', zIndex: 10, padding: '60px 20px', maxWidth: '700px', margin: '0 auto', width: '100%' }}>

            <h1 className="font-heading" style={{ color: '#e4e4e7', fontSize: '2.2rem', fontWeight: '900', textAlign: 'center', marginBottom: '48px', letterSpacing: '2px' }}>
              CONECTATE
            </h1>

            <div style={{ background: '#0a0a0e', border: '1px solid #1e1e2a', padding: '32px' }}>
              <Form layout="vertical" onFinish={onFinish}>

                <Form.Item
                  label={<span className="contact-label">Nombre Completo</span>}
                  name="nombre"
                  colon={false}
                >
                  <Input placeholder="INGRESÁ TU NOMBRE..." />
                </Form.Item>

                <Form.Item
                  label={<span className="contact-label">E-mail de Contacto</span>}
                  name="email"
                  colon={false}
                >
                  <Input placeholder="SYS@SERVER.COM" />
                </Form.Item>

                <Form.Item
                  label={<span className="contact-label">Mensaje</span>}
                  name="mensaje"
                  colon={false}
                >
                  <TextArea rows={5} placeholder="INGRESAR TRANSMISIÓN AQUÍ..." />
                </Form.Item>

                <Form.Item style={{ marginBottom: 0 }}>
                  <button className="cta-btn" type="submit">
                    ENVIAR TRANSMISIÓN
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="9 18 15 12 9 6"/></svg>
                  </button>
                </Form.Item>

              </Form>
            </div>

          </Content>

          {/* FOOTER */}
          <Footer style={{ background: '#050507', borderTop: '1px solid #1e1e2a', padding: '30px 40px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '16px', zIndex: 10 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
              <span className="font-heading" style={{ color: '#a1a1aa', fontStyle: 'italic', fontWeight: 'bold', fontSize: '14px' }}>new ESSENTIAL</span>
              <span style={{ color: '#52525b', fontSize: '12px' }}>© 2026. ALL RIGHTS RESERVED.</span>
            </div>
            <div style={{ display: 'flex', gap: '15px', color: '#a1a1aa' }}>
              <a href="#" style={{ color: '#a1a1aa' }}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
              </a>
              <a href="#" style={{ color: '#a1a1aa' }}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
              </a>
            </div>
          </Footer>

        </Layout>
      );
    }

    ReactDOM.render(<ContactoApp />, document.getElementById('root'));
  </script>
</body>
</html>
