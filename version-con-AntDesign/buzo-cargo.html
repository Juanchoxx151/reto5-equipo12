<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="New Essential Buzo Seven Words — Buzo de algodón. ARS 34.999.">
  <title>Buzo Seven Words | New Essential</title>

  <!-- Google Fonts: Orbitron & Rajdhani & Inter (carga de fuentes, no es CSS propio) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- React + ReactDOM (CDN, sin NPM, versión fija) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Ant Design (CDN, sin NPM, versión fija). antd v5 inyecta sus propios estilos por JS: no hace falta ningún .css -->
  <script src="https://unpkg.com/dayjs@1.11.11/dayjs.min.js"></script>
  <script src="https://unpkg.com/antd@5.21.6/dist/antd.min.js"></script>

  <!-- Babel Standalone: permite escribir JSX directo en el navegador sin build/NPM -->
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const {
      ConfigProvider, Layout, Menu, Row, Col, Card, Button,
      Typography, Radio, Space, Grid, Divider, theme
    } = antd;
    const { Header, Content, Footer } = Layout;
    const { Title, Text, Paragraph } = Typography;
    const { useBreakpoint } = Grid;

    // Reset del <body> sin usar CSS: se hace por JS, ya que no hay hoja de estilos propia
    document.body.style.margin = '0';
    document.body.style.backgroundColor = '#050507';
    document.documentElement.style.backgroundColor = '#050507';

    // Paleta y fuentes tomadas 1:1 del tailwind.config.js de la versión Tailwind
    const COLORS = {
      neonCyan: '#00f0ff',
      bg: '#050507',
      card: '#0a0a0e',
      surface: '#111118',
      border: '#1e1e2a',
      chromeLight: '#e4e4e7',
      chromeMid: '#a1a1aa',
      chromeDark: '#52525b',
    };
    const FONT_HEADING = "'Orbitron', sans-serif";
    const FONT_ACCENT = "'Rajdhani', sans-serif";
    const FONT_BODY = "'Inter', sans-serif";

    // Íconos como SVG inline (evita depender de @ant-design/icons por CDN, que es frágil sin bundler)
    const SearchOutlined = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.35-4.35" /></svg>
    );
    const UserOutlined = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>
    );
    const ShoppingCartOutlined = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" /><line x1="3" y1="6" x2="21" y2="6" /><path d="M16 10a4 4 0 0 1-8 0" /></svg>
    );
    const ArrowLeftOutlined = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="19" y1="12" x2="5" y2="12" /><polyline points="12 19 5 12 12 5" /></svg>
    );
    const ArrowRightOutlined = () => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="9 18 15 12 9 6" /></svg>
    );
    const FacebookOutlined = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z" /></svg>
    );
    const InstagramOutlined = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5" /><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" /><line x1="17.5" y1="6.5" x2="17.51" y2="6.5" /></svg>
    );

    const menuItems = [
      { key: 'home', label: <a href="index.html">HOME</a> },
      {
        key: 'catalogo',
        label: 'CATALOGO',
        children: [
          { key: 'remeras', label: <a href="index.html">Remeras</a> },
          { key: 'pantalones', label: <a href="index.html">Pantalones</a> },
          { key: 'buzos', label: <a href="index.html">Buzos</a> },
          { key: 'gorras', label: <a href="index.html">Gorras</a> },
        ],
      },
      { key: 'newdrops', label: <a href="new_drops.html">NEW DROPS</a> },
      { key: 'nosotros', label: <a href="quienes_somos.html">NOSOTROS</a> },
      { key: 'contacto', label: <a href="contacto.html">CONTACTO</a> },
    ];

    function SiteHeader({ screens }) {
      return (
        <Header style={{ position: 'sticky', top: 0, zIndex: 30, height: 'auto', lineHeight: 'normal', padding: '0 16px', borderBottom: `1px solid ${COLORS.border}` }}>
          <Row align="middle" style={{ padding: '8px 0' }}>
            <Col xs={0} md={8} />
            <Col xs={16} md={8} style={{ textAlign: 'center' }}>
              <a href="index.html">
                <img src="./img/logo.png" alt="NEW ESSENTIAL — sentí la esencia" style={{ height: 64, width: 'auto', objectFit: 'contain' }} />
              </a>
            </Col>
            <Col xs={8} md={8} style={{ textAlign: 'right' }}>
              <Space size="large">
                <Space direction="vertical" size={0} align="center" style={{ cursor: 'pointer', color: COLORS.chromeMid }}>
                  <SearchOutlined />
                  {screens.md && <Text style={{ fontFamily: FONT_HEADING, fontSize: 9, letterSpacing: 2 }}>SEARCH</Text>}
                </Space>
                <Space direction="vertical" size={0} align="center" style={{ cursor: 'pointer', color: COLORS.chromeMid }}>
                  <UserOutlined />
                  {screens.md && <Text style={{ fontFamily: FONT_HEADING, fontSize: 9, letterSpacing: 2 }}>PROFILE</Text>}
                </Space>
                <Space direction="vertical" size={0} align="center" style={{ cursor: 'pointer', color: COLORS.chromeMid }}>
                  <ShoppingCartOutlined />
                  {screens.md && <Text style={{ fontFamily: FONT_HEADING, fontSize: 9, letterSpacing: 2 }}>CART</Text>}
                </Space>
              </Space>
            </Col>
          </Row>

          <div style={{ background: '#9ca3af' }}>
            <Menu
              mode="horizontal"
              items={menuItems}
              selectable={false}
              style={{
                background: 'transparent',
                borderBottom: 'none',
                justifyContent: 'center',
                fontFamily: FONT_HEADING,
                color: '#0a0a0a',
              }}
            />
          </div>
        </Header>
      );
    }

    function SiteFooter() {
      return (
        <Footer style={{ borderTop: `1px solid ${COLORS.border}` }}>
          <Row justify="space-between" align="middle" gutter={[16, 16]}>
            <Col>
              <Space>
                <Text italic strong style={{ fontFamily: FONT_HEADING, letterSpacing: 2 }}>new ESSENTIAL</Text>
                <Text style={{ color: COLORS.chromeDark, fontSize: 12 }}>© 2026. ALL RIGHTS RESERVED.</Text>
              </Space>
            </Col>
            <Col>
              <Space size="middle">
                <a href="#" style={{ color: COLORS.chromeLight }}><FacebookOutlined /></a>
                <a href="#" style={{ color: COLORS.chromeLight }}><InstagramOutlined /></a>
              </Space>
            </Col>
          </Row>
        </Footer>
      );
    }

    function App() {
      const screens = useBreakpoint();

      return (
        <ConfigProvider
          theme={{
            algorithm: theme.darkAlgorithm,
            token: {
              colorPrimary: COLORS.neonCyan,
              colorBgBase: COLORS.bg,
              colorBgContainer: COLORS.card,
              colorBorder: COLORS.border,
              colorText: COLORS.chromeLight,
              colorTextSecondary: COLORS.chromeMid,
              fontFamily: FONT_BODY,
            },
            components: {
              Layout: {
                headerBg: COLORS.bg,
                bodyBg: COLORS.bg,
                footerBg: COLORS.bg,
              },
            },
          }}
        >
          <Layout style={{ minHeight: '100vh' }}>
            <SiteHeader screens={screens} />

            <Content style={{ maxWidth: 1152, margin: '0 auto', width: '100%', padding: '24px 16px 60px' }}>

              {/* VOLVER AL CATÁLOGO */}
              <Button
                type="link"
                href="index.html"
                icon={<ArrowLeftOutlined />}
                style={{ paddingLeft: 0, fontFamily: FONT_HEADING, fontSize: 11, letterSpacing: 3, color: COLORS.chromeLight, marginBottom: 24 }}
              >
                [ VOLVER AL CATÁLOGO ]
              </Button>

              <Row gutter={[48, 32]}>
                {/* IMAGEN PRINCIPAL */}
                <Col xs={24} lg={12}>
                  <Card
                    bordered
                    style={{ borderColor: COLORS.border, background: COLORS.surface, overflow: 'hidden' }}
                    bodyStyle={{ padding: 0 }}
                  >
                    <img
                      src="./img/buzo_nuevo.png"
                      alt="New Essential Buzo Seven Words"
                      style={{ width: '100%', aspectRatio: '1 / 1', objectFit: 'cover', display: 'block' }}
                    />
                  </Card>
                </Col>

                {/* INFO Y ACCIONES */}
                <Col xs={24} lg={12}>
                  <Text style={{ fontFamily: FONT_HEADING, color: COLORS.neonCyan, fontSize: 12, letterSpacing: 4, textTransform: 'uppercase' }}>
                    [ BUZOS ]
                  </Text>
                  <Title level={2} style={{ fontFamily: FONT_HEADING, color: COLORS.chromeLight, letterSpacing: 1, marginTop: 12, marginBottom: 12 }}>
                    NEW ESSENTIAL BUZO SEVEN WORDS
                  </Title>
                  <Text style={{ fontFamily: FONT_ACCENT, fontWeight: 700, fontSize: 28, color: COLORS.neonCyan, display: 'block', marginBottom: 24 }}>
                    ARS 34.999
                  </Text>

                  <Divider style={{ borderColor: COLORS.border, margin: '0 0 24px' }} />

                  {/* COLOR */}
                  <div style={{ marginBottom: 24 }}>
                    <Text style={{ fontFamily: FONT_HEADING, fontSize: 10, letterSpacing: 3, textTransform: 'uppercase' }}>
                      <Text style={{ color: COLORS.chromeMid, fontFamily: FONT_HEADING, fontSize: 10 }}>COLOR:// </Text>
                      Gris Oscuro
                    </Text>
                  </div>

                  {/* TALLES — sin preselección por defecto */}
                  <div style={{ marginBottom: 24 }}>
                    <Text style={{ fontFamily: FONT_HEADING, fontSize: 10, letterSpacing: 3, textTransform: 'uppercase', display: 'block', marginBottom: 12 }}>
                      <Text style={{ color: COLORS.chromeMid, fontFamily: FONT_HEADING, fontSize: 10 }}>SIZE:// </Text>
                    </Text>
                    <Radio.Group buttonStyle="solid" style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                      {['S', 'M', 'L', 'XL'].map((talle) => (
                        <Radio.Button key={talle} value={talle} style={{ fontFamily: FONT_HEADING, minWidth: 56, textAlign: 'center' }}>
                          {talle}
                        </Radio.Button>
                      ))}
                    </Radio.Group>
                  </div>

                  {/* DESCRIPCIÓN */}
                  <Paragraph style={{ color: COLORS.chromeMid, fontFamily: FONT_BODY, fontSize: 14, lineHeight: 1.7, marginBottom: 24 }}>
                    Buzo de algodón 380 gr/m². Capucha estructurada con cordón plano. Bolsillo canguro frontal reforzado. Cuffs y borde inferior en rib doble. Estampado editorial Seven Words en serigrafía alta densidad.
                  </Paragraph>

                  {/* CTA */}
                  <Button
                    type="primary"
                    size="large"
                    block
                    href="contacto.html"
                    style={{ fontFamily: FONT_HEADING, letterSpacing: 2, fontWeight: 600, height: 52 }}
                  >
                    <Space>
                      CONSULTAR DISPONIBILIDAD
                      <ArrowRightOutlined />
                    </Space>
                  </Button>
                </Col>
              </Row>
            </Content>

            <SiteFooter />
          </Layout>
        </ConfigProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
