<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="New Essential Cargo Seven Words — Pantalón cargo. ARS 39.999.">
<title>Cargo Seven Words | New Essential</title>

<!-- Fuentes (mismas que la versión Tailwind) -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

<!-- React -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<!-- Dependencia de antd -->
<script src="https://unpkg.com/dayjs@1/dayjs.min.js"></script>
<!-- Ant Design (reset propio del framework, no es CSS nuestro) -->
<link rel="stylesheet" href="https://unpkg.com/antd@5/dist/reset.css">
<script src="https://unpkg.com/antd@5/dist/antd.min.js"></script>
<!-- Babel para poder escribir JSX directo en el navegador, sin build -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;">
<div id="root"></div>

<script type="text/babel">
const { ConfigProvider, theme, Layout, Menu, Badge, Row, Col, Image,
        Typography, Divider, Button, Space, Radio } = antd;
const { Header, Content, Footer } = Layout;
const { Title, Text, Paragraph } = Typography;

/* ---------- Iconos (SVG inline, igual que la versión Tailwind) ---------- */
const IconSearch = () => (
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
  </svg>
);
const IconUser = () => (
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
  </svg>
);
const IconCart = () => (
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
    <line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>
  </svg>
);
const IconArrowLeft = () => (
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
  </svg>
);
const IconChevronRight = () => (
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <polyline points="9 18 15 12 9 6"/>
  </svg>
);

/* ---------- Paleta / tipografía (equivalente al tailwind.config) -------- */
const neonCyan   = '#00f0ff';
const darkBg     = '#050507';
const darkCard   = '#0a0a0e';
const darkSurface = '#111118';
const darkBorder = '#1e1e2a';
const chromeLight = '#e4e4e7';
const chromeMid   = '#a1a1aa';
const chromeDark  = '#52525b';
const fontHeading = '"Orbitron", sans-serif';
const fontAccent  = '"Rajdhani", sans-serif';
const fontBody    = '"Inter", sans-serif';

/* ---------- Datos del producto ------------------------------------------ */
const producto = {
  categoria: 'PANTALONES',
  nombre: 'NEW ESSENTIAL CARGO SEVEN WORDS',
  precio: 'ARS 39.999',
  color: 'Negro',
  talles: ['40', '42', '44', '46'],
  descripcion: 'Pantalón cargo de gabardina pesada. Corte recto con bolsillos laterales de parche y cierre de pinza. Tiro medio, pretina elástica en espalda. Terminación con ojales de metal y tiritas de ajuste.',
  imagen: 'img/pantalon_nuevo.png'
};

function Marca() {
  return (
    <a href="index.html">
      <img src="img/logo.png" alt="NEW ESSENTIAL — sentí la esencia" style={{ height: 96, width: 'auto', objectFit: 'contain' }} />
    </a>
  );
}

function TopBar() {
  return (
    <div style={{ display: 'flex', alignItems: 'center', padding: '0 16px' }}>
      <div style={{ width: 128 }} />
      <div style={{ flex: 1, textAlign: 'center' }}>
        <Marca />
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 20 }}>
        <button style={btnIconStyle} aria-label="Buscar">
          <IconSearch /><span style={iconLabelStyle}>SEARCH</span>
        </button>
        <button style={btnIconStyle} aria-label="Perfil">
          <IconUser /><span style={iconLabelStyle}>PROFILE</span>
        </button>
        <Badge count={0} showZero color={neonCyan} style={{ color: darkBg, fontWeight: 700 }}>
          <button style={btnIconStyle} aria-label="Carrito">
            <IconCart /><span style={iconLabelStyle}>CART</span>
          </button>
        </Badge>
      </div>
    </div>
  );
}
const btnIconStyle = {
  background: 'none', border: 'none', color: chromeMid, cursor: 'pointer',
  display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2
};
const iconLabelStyle = { fontFamily: fontHeading, fontSize: 9, letterSpacing: '0.1em' };

/* Nav: tamaño, peso y espaciado equivalentes a la versión Tailwind (text-sm, font-bold, tracking-[0.18em], py-2.5, px-6) */
function NavBar() {
  const linkStyle = {
    color: '#030712',       // equivalente a text-gray-950
    fontWeight: 700,        // equivalente a font-bold
    textDecoration: 'none',
  };
  const menuItems = [
    { key: 'home', label: <a href="index.html" style={linkStyle}>HOME</a> },
    {
      key: 'catalogo', label: <span style={linkStyle}>CATALOGO</span>,
      children: [
        { key: 'remeras', label: <a href="new_drops.html">Remeras</a> },
        { key: 'pantalones', label: <a href="new_drops.html">Pantalones</a> },
        { key: 'buzos', label: <a href="new_drops.html">Buzos</a> },
        { key: 'gorras', label: <a href="new_drops.html">Gorras</a> },
      ],
    },
    { key: 'new', label: <a href="new_drops.html" style={linkStyle}>NEW DROPS</a> },
    { key: 'nosotros', label: <a href="quienes_somos.html" style={linkStyle}>NOSOTROS</a> },
    { key: 'contacto', label: <a href="contacto.html" style={linkStyle}>CONTACTO</a> },
  ];
  return (
    <ConfigProvider theme={{ components: { Menu: {
        itemColor: '#030712', itemHoverColor: '#000000',
        horizontalItemSelectedColor: '#000000', itemBg: '#9ca3af',
        horizontalItemHoverBg: '#9ca3af', fontSize: 14, fontWeightStrong: 700,
        horizontalItemPaddingInline: 24,
    } } }}>
      <div style={{ background: '#9ca3af', padding: '10px 0' }}>
        <Menu
          mode="horizontal"
          items={menuItems}
          selectable={false}
          style={{ justifyContent: 'center', background: 'transparent', fontFamily: fontHeading, letterSpacing: '0.18em', borderBottom: 'none', lineHeight: 'normal' }}
        />
      </div>
    </ConfigProvider>
  );
}

function App() {
  return (
    <ConfigProvider theme={{
      algorithm: theme.darkAlgorithm,
      token: {
        colorPrimary: neonCyan,
        colorBgBase: darkBg,
        colorBgContainer: darkCard,
        colorBorder: darkBorder,
        colorText: chromeLight,
        colorTextSecondary: chromeMid,
        colorTextTertiary: chromeDark,
        fontFamily: fontBody,
      },
    }}>
      <Layout style={{ minHeight: '100vh', background: darkBg }}>
        <Header style={{ position: 'sticky', top: 0, zIndex: 30, background: darkBg, borderBottom: `1px solid ${darkBorder}`, height: 'auto', lineHeight: 'normal', padding: 0 }}>
          <TopBar />
          <NavBar />
        </Header>

        <Content style={{ padding: '24px 24px 80px' }}>
          <div style={{ maxWidth: 1152, margin: '0 auto' }}>

            <a href="index.html" style={{ display: 'inline-flex', alignItems: 'center', gap: 8, color: chromeLight, marginBottom: 32, fontFamily: fontHeading, fontSize: 12, letterSpacing: '0.2em', textDecoration: 'none' }}>
              <IconArrowLeft /> [ VOLVER AL CATÁLOGO ]
            </a>

            <Row gutter={[64, 32]}>
              <Col xs={24} lg={12}>
                <div style={{ aspectRatio: '1 / 1', background: darkSurface, border: `1px solid ${darkBorder}`, overflow: 'hidden' }}>
                  <Image
                    src={producto.imagen}
                    alt={producto.nombre}
                    preview={false}
                    width="100%"
                    height="100%"
                    style={{ objectFit: 'cover' }}
                  />
                </div>
              </Col>

              <Col xs={24} lg={12}>
                <Text style={{ display: 'block', color: neonCyan, fontFamily: fontHeading, fontSize: 12, letterSpacing: '0.25em', marginBottom: 12 }}>
                  [ {producto.categoria} ]
                </Text>

                <Title level={1} style={{ color: chromeLight, fontFamily: fontHeading, fontWeight: 700, fontSize: 28, letterSpacing: '0.02em', marginBottom: 16 }}>
                  {producto.nombre}
                </Title>

                <Title level={2} style={{ color: neonCyan, fontFamily: fontAccent, fontSize: 30, marginTop: 0, marginBottom: 32 }}>
                  {producto.precio}
                </Title>

                <Divider style={{ borderColor: darkBorder, marginTop: 0 }} />

                <div style={{ marginBottom: 32 }}>
                  <Text style={{ fontFamily: fontHeading, fontSize: 10, letterSpacing: '0.2em', textTransform: 'uppercase', color: chromeLight }}>
                    <span style={{ color: chromeMid }}>COLOR://</span> {producto.color}
                  </Text>
                </div>

                {/* Selector de talles: ConfigProvider local sube el contraste del
                    borde (colorBorder) del Radio.Button, que con el token global
                    oscuro casi no se veía sobre el fondo negro */}
                <div style={{ marginBottom: 32 }}>
                  <Text style={{ display: 'block', fontFamily: fontHeading, fontSize: 10, letterSpacing: '0.2em', textTransform: 'uppercase', color: chromeMid, marginBottom: 12 }}>
                    TALLE://
                  </Text>
                  <ConfigProvider theme={{ components: { Radio: {
                      colorBorder: chromeLight,
                      buttonBg: 'transparent',
                      buttonColor: chromeLight,
                  } } }}>
                    <Radio.Group buttonStyle="outline" style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 8, width: '100%' }}>
                      {producto.talles.map((t) => (
                        <Radio.Button
                          key={t}
                          value={t}
                          style={{ textAlign: 'center', height: 44, lineHeight: '42px', fontFamily: fontHeading, fontSize: 12, letterSpacing: '0.1em' }}
                        >
                          {t}
                        </Radio.Button>
                      ))}
                    </Radio.Group>
                  </ConfigProvider>
                </div>

                <Paragraph style={{ color: chromeMid, fontSize: 14, lineHeight: 1.7, marginBottom: 32 }}>
                  {producto.descripcion}
                </Paragraph>

                <Button
                  type="primary"
                  ghost
                  href="contacto.html"
                  block
                  size="large"
                  style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 12, fontFamily: fontHeading, letterSpacing: '0.1em', color: '#ffffff', borderColor: neonCyan }}
                >
                  CONSULTAR DISPONIBILIDAD <IconChevronRight />
                </Button>
              </Col>
            </Row>
          </div>
        </Content>

        <Footer style={{ textAlign: 'center', borderTop: `1px solid ${darkBorder}`, background: 'rgba(5,5,7,0.9)' }}>
          <Space size={8} style={{ fontFamily: fontHeading }}>
            <Text style={{ color: chromeLight, fontStyle: 'italic', fontWeight: 700, letterSpacing: '0.15em' }}>new ESSENTIAL</Text>
            <Text style={{ color: chromeDark, fontSize: 12 }}>© 2026. ALL RIGHTS RESERVED.</Text>
          </Space>
        </Footer>
      </Layout>
    </ConfigProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
